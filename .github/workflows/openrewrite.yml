name: OpenRewrite

on:
  push:
    branches: [master]
    paths: ['OpenRewrite/**']
  workflow_dispatch:

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run OpenRewrite (dry-run)
        run: DRY_RUN=true bash OpenRewrite/scripts/run-openrewrite.sh

