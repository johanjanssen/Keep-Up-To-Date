name: Measure Docker Images

on:
  push:
    branches: [master]
    paths: ['Build Docker Images/**', 'images.conf']
  workflow_dispatch:

# Several workflows publish their own subfolder to the same gh-pages branch.
# Each workflow gets its OWN concurrency group (rather than sharing one) so this
# run — including the Docker builds and measurements above — is never cancelled
# while queued behind an unrelated workflow's deploy: GitHub cancels *queued*
# runs within a shared group even with cancel-in-progress: false. The deploy
# step below still pushes to the shared gh-pages branch, so it's wrapped in
# Wandalen/wretry.action to retry automatically on the rare occasion it
# collides with another workflow's push.
concurrency:
  group: "gh-pages-deploy-measure-images"
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Note: Docker multi-stage builds compile the app internally.
      # No separate Maven build needed here.

      - name: Pull & tag base images
        run: bash "Build Docker Images/pull-base-images.sh"

      - name: Build all hello-conference Docker images
        run: bash "Build Docker Images/build-all-images.sh"
        # A single flaky image shouldn't stop the others from being measured and
        # reported on — measure-images.sh / measure-performance.sh already handle
        # unbuilt images gracefully (they show up as "NOT BUILT" / are skipped).
        continue-on-error: true

      - name: Measure image size & packages
        run: |
          bash "Build Docker Images/measure-images.sh" 2>&1 | tee /tmp/measure-images-output.txt
          echo "## 📦 Docker Image Size & Package Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/measure-images-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Measure startup time & memory
        run: |
          bash "Build Docker Images/measure-performance.sh" 2>&1 | tee /tmp/measure-performance-output.txt
          echo "## ⏱️ Docker Image Startup & Memory Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/measure-performance-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate HTML reports
        run: |
          python3 "Build Docker Images/scripts/generate-html-report.py" \
            /tmp/measure-images-output.txt \
            /tmp/measure-performance-output.txt \
            "Build Docker Images/target/results/html/index.html" \
            "Build Docker Images/target/results/html-custom/index.html" \
            --title "Docker Image Size & Performance Comparison" \
            --custom-title "hello-conference Image & Performance Comparison"

      - name: Prepare Pages directories
        run: |
          mkdir -p tmp/pages tmp/pages-custom
          cp "Build Docker Images/target/results/html/index.html" tmp/pages/
          cp "Build Docker Images/target/results/html-custom/index.html" tmp/pages-custom/

      # Published as their own subfolders (destination_dir + keep_files) rather
      # than actions/deploy-pages: this repo has multiple workflows publishing to
      # the same Pages site, and actions/deploy-pages replaces the ENTIRE site on
      # every run (it also requires an environment: github-pages block on the job
      # — the missing one of which is exactly the "Missing environment" deploy
      # error) — peaceiris pushes to the gh-pages branch and destination_dir
      # scopes each workflow to its own folder. Base images and hello-conference
      # images/performance are split into separate pages, so each gets its own
      # deploy step.
      - name: Deploy to GitHub Pages (images/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: images
            keep_files: true

      # Now the base-images report is available under https://johanjanssen.github.io/Keep-Up-To-Date/images[/index.html]

      - name: Deploy to GitHub Pages (custom-images/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages-custom
            destination_dir: custom-images
            keep_files: true

      # Now the hello-conference report is available under https://johanjanssen.github.io/Keep-Up-To-Date/custom-images[/index.html]

      - name: Upload measurement data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-measurement-data
          path: |
            /tmp/measure-images-output.txt
            /tmp/measure-performance-output.txt
