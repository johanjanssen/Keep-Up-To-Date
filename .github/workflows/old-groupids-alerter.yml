name: Old GroupIds Alerter

on:
  push:
    branches: [master]
    paths: ['Old GroupIds Alerter/**']
  workflow_dispatch:

# Several workflows (static.yml, jacoco.yml, owasp-dc.yml, compare-scans.yml,
# openrewrite.yml, this one) each publish their own subfolder to the same
# gh-pages branch. Each workflow gets its OWN concurrency group (rather than
# sharing one) so this run is never cancelled while queued behind an unrelated
# workflow's deploy — GitHub cancels *queued* runs within a shared group even
# with cancel-in-progress: false. The deploy step below still pushes to the
# shared gh-pages branch, so it's wrapped in Wandalen/wretry.action to retry
# automatically on the rare occasion it collides with another workflow's push.
concurrency:
  group: "gh-pages-deploy-old-groupids-alerter"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run STRICT check (plugin default — demonstrates the CI gate actually failing)
        id: strict
        continue-on-error: true
        run: STRICT=true bash "Old GroupIds Alerter/scripts/run-oga.sh"

      - name: Run check in report mode (collect every finding; build stays green)
        run: |
          bash "Old GroupIds Alerter/scripts/run-oga.sh" 2>&1 | tee /tmp/oga-output.log

      - name: Generate HTML report
        run: |
          mkdir -p tmp/pages
          python3 "Old GroupIds Alerter/scripts/generate-html-report.py" \
            /tmp/oga-output.log \
            "Old GroupIds Alerter/pom.xml" \
            tmp/pages/index.html \
            --title "Old GroupIds Alerter demo — groupIds that moved"
          echo "## 🧭 Old GroupIds Alerter" >> $GITHUB_STEP_SUMMARY
          echo "Checked pom.xml against the community-maintained old-groupId database." >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.strict.outcome }}" = "failure" ]; then
            echo "STRICT run (plugin default, failOnError=true): **build FAILED** — exactly what would happen in a real CI gate." >> $GITHUB_STEP_SUMMARY
          else
            echo "STRICT run (plugin default, failOnError=true): build passed (no old groupIds found)." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Report: https://johanjanssen.github.io/Keep-Up-To-Date/renamed/" >> $GITHUB_STEP_SUMMARY

      # Published as its own subfolder (destination_dir + keep_files) rather than
      # actions/deploy-pages: this repo has multiple workflows publishing to the
      # same Pages site, and actions/deploy-pages replaces the ENTIRE site on every
      # run (it also requires an environment: github-pages block on the job, which
      # is where "Missing environment" comes from) — peaceiris pushes to the
      # gh-pages branch and destination_dir scopes each workflow to its own folder.
      #
      # destination_dir is "renamed" (not "Old GroupIds Alerter") on purpose — the
      # report is about dependency coordinates that need renaming in pom.xml, and
      # a short, URL-friendly path is nicer to link to than one with spaces.
      - name: Deploy to GitHub Pages (renamed/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: renamed
            keep_files: true

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/renamed[/index.html]

      - name: Upload check output as a workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-groupids-alerter-output
          path: /tmp/oga-output.log
