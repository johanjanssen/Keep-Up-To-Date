name: Build Docker Images

on:
  push:
    branches: [main]
    paths: ['Build Docker Images/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build application JAR
        run: ./mvnw -f "Vulnerable Application/pom.xml" package -DskipTests

      - name: Pull base images
        run: bash "Build Docker Images/pull-base-images.sh"

      - name: Build all Docker images
        run: bash "Build Docker Images/build-all-images.sh"

      - name: Measure image sizes
        run: bash "Build Docker Images/measure-images.sh"

