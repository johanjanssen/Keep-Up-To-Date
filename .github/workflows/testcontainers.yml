name: Testcontainers

on:
  push:
    branches: [master]
    paths: ['Testcontainers/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Testcontainers integration tests
        run: bash Testcontainers/scripts/run-tests.sh

