name: Testcontainers

on:
  push:
    branches: [master]
    paths: ['Testcontainers/**']
  workflow_dispatch:

# Several workflows publish their own subfolder to the same gh-pages branch.
# Each workflow gets its OWN concurrency group (rather than sharing one) so this
# run — including the integration tests above — is never cancelled while queued
# behind an unrelated workflow's deploy: GitHub cancels *queued* runs within a
# shared group even with cancel-in-progress: false. The deploy step below still
# pushes to the shared gh-pages branch, so it's wrapped in Wandalen/wretry.action
# to retry automatically on the rare occasion it collides with another
# workflow's push.
concurrency:
  group: "gh-pages-deploy-testcontainers"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run Testcontainers integration tests
        id: run_tests
        continue-on-error: true
        run: bash Testcontainers/scripts/run-tests.sh 2>&1 | tee /tmp/testcontainers-output.txt

      - name: Generate HTML report
        run: |
          python3 "Testcontainers/scripts/generate-html-report.py" \
            --log /tmp/testcontainers-output.txt \
            --surefire-dir "Testcontainers/target/surefire-reports" \
            --output "Testcontainers/target/pages-report/index.html" \
            --title "Testcontainers Integration Tests — Maven Result"

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/pages
          cp Testcontainers/target/pages-report/index.html tmp/pages/

      # Published as its own subfolder (destination_dir + keep_files) rather than
      # actions/deploy-pages: this repo has multiple workflows publishing to the
      # same Pages site, and actions/deploy-pages replaces the ENTIRE site on every
      # run (it also requires an environment: github-pages block on the job, which
      # is where "Missing environment" comes from) — peaceiris pushes to the
      # gh-pages branch and destination_dir scopes each workflow to its own folder.
      - name: Deploy to GitHub Pages (testcontainers/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: testcontainers
            keep_files: true

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/testcontainers[/index.html]

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
