name: OWASP Dependency Check

on:
  push:
    branches: [master]
    paths: ['OWASP Dependency Check/**', 'Vulnerable Application/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Vulnerable App
        run: ./mvnw -f "Vulnerable Application/pom.xml" package -DskipTests

      - name: Get cache date
        id: cache-date
        # A new cache "generation" every day keeps the cache from growing forever
        # while restore-keys below still lets each day start from yesterday's data,
        # so update-cache.sh / dependency-check:check only ever process the delta.
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore NVD cache
        id: restore-nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            OWASP Dependency Check/data/nvd-cache
            ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-owasp-dc-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            nvd-owasp-dc-

      - name: Start NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/start-cache.sh"

      - name: Update NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/update-cache.sh"

      - name: Run dependency check
        run: bash "OWASP Dependency Check/scripts/run-check.sh" || true

      - name: Save NVD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            OWASP Dependency Check/data/nvd-cache
            ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.restore-nvd-cache.outputs.cache-primary-key }}

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/pages/OWASP
          # Renamed to index.html so the report is actually reachable at .../OWASP/
          # instead of only at .../OWASP/dependency-check-report.html
          cp "Vulnerable Application/target/dependency-check-report.html" tmp/pages/OWASP/index.html
          cp "Vulnerable Application/target/dependency-check-report.json" tmp/pages/OWASP/ 2>/dev/null || true
          cp "Vulnerable Application/target/dependency-check-report.sarif" tmp/pages/OWASP/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/OWASP[/index.html]
