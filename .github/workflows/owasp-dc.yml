name: OWASP Dependency Check

on:
  push:
    branches: [main]
    paths: ['OWASP Dependency Check/**', 'Vulnerable Application/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Vulnerable App
        run: ./mvnw -f "Vulnerable Application/pom.xml" package -DskipTests

      - name: Start NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/start-cache.sh"

      - name: Update NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/update-cache.sh"

      - name: Run dependency check
        run: bash "OWASP Dependency Check/scripts/run-check.sh" || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Vulnerable Application/target/dependency-check-report.*

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
