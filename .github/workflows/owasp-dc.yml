name: OWASP Dependency Check

on:
  push:
    branches: [master]
    paths: ['OWASP Dependency Check/**', 'Vulnerable Application/**']
  workflow_dispatch:

# Several workflows (static.yml, jacoco.yml, compare-scans.yml, this one) each
# publish their own subfolder to the same gh-pages branch. Each workflow gets its
# OWN concurrency group (rather than sharing one) so this run — including the
# slow dependency-check scan above — is never cancelled while queued behind an
# unrelated workflow's deploy: GitHub cancels *queued* runs within a shared
# group even with cancel-in-progress: false. The deploy step below still pushes
# to the shared gh-pages branch, so it's wrapped in Wandalen/wretry.action to
# retry automatically on the rare occasion it collides with another workflow's
# push.
concurrency:
  group: "gh-pages-deploy-owasp-dc"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Vulnerable App
        run: ./mvnw -f "Vulnerable Application/pom.xml" package -DskipTests

      - name: Get cache date
        id: cache-date
        # A new cache "generation" every day keeps the cache from growing forever
        # while restore-keys below still lets each day start from yesterday's data,
        # so update-cache.sh / dependency-check:check only ever process the delta.
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore NVD cache
        id: restore-nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            OWASP Dependency Check/data/nvd-cache
            ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-owasp-dc-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            nvd-owasp-dc-

      - name: Start NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/start-cache.sh"

      - name: Update NVD cache
        env:
          # This maps your GitHub secret to an environment variable the tool can read
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash "OWASP Dependency Check/scripts/update-cache.sh"

      - name: Run dependency check
        run: bash "OWASP Dependency Check/scripts/run-check.sh" || true

      - name: Save NVD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            OWASP Dependency Check/data/nvd-cache
            ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ steps.restore-nvd-cache.outputs.cache-primary-key }}

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/pages
          # Renamed to index.html so the report is actually reachable at .../OWASP/
          # instead of only at .../OWASP/dependency-check-report.html
          cp "Vulnerable Application/target/dependency-check-report.html" tmp/pages/index.html
          cp "Vulnerable Application/target/dependency-check-report.json" tmp/pages/ 2>/dev/null || true
          cp "Vulnerable Application/target/dependency-check-report.sarif" tmp/pages/ 2>/dev/null || true

      # Published as its own subfolder (destination_dir + keep_files) rather than
      # actions/deploy-pages: this repo has multiple workflows publishing to the
      # same Pages site, and actions/deploy-pages replaces the ENTIRE site on every
      # run (it also requires an environment: github-pages block on the job, which
      # is where "Missing environment" comes from) — peaceiris pushes to the
      # gh-pages branch and destination_dir scopes each workflow to its own folder.
      - name: Deploy to GitHub Pages (OWASP/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: OWASP
            keep_files: true

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/OWASP[/index.html]
