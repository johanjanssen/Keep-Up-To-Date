name: "Performance — Java 17 vs 25 vs 28 EA (Valhalla)"

on:
  push:
    branches: [ master ]
    paths: [ 'Performance Improvement/**' ]
  workflow_dispatch:

jobs:
  benchmark-17-vs-25:
    name: "📊 Java 17 vs Java 25"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Performance Improvement"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.java17 -t bench:java17 .
          docker build -f Dockerfile.java25 -t bench:java25 .

      - name: "📊 Run Java 17 benchmarks"
        run: |
          mkdir -p results
          docker run --rm -v "$(pwd)/results:/results" bench:java17 \
            -f 3 -wi 5 -i 5 -p size=1000000 -p taskCount=10000 \
            "BoxingOverhead|ObjectAllocation|StreamPerformance|VirtualThreads" \
            2>&1 | tee results/java17-output.txt
          cp results/results.json results/java17.json

      - name: "📊 Run Java 25 benchmarks"
        run: |
          docker run --rm -v "$(pwd)/results:/results" bench:java25 \
            -f 3 -wi 5 -i 5 -p size=1000000 -p taskCount=10000 \
            "BoxingOverhead|ObjectAllocation|StreamPerformance|VirtualThreads" \
            2>&1 | tee results/java25-output.txt
          cp results/results.json results/java25.json

      - name: "🧠 Run memory benchmarks (GC profiler)"
        run: |
          docker run --rm -v "$(pwd)/results:/results" bench:java17 \
            -f 3 -wi 5 -i 5 -prof gc \
            -p size=1000000 -p taskCount=10000 \
            "BoxingOverhead|ObjectAllocation|StreamPerformance|VirtualThreads" \
            2>&1 | tee results/java17-gc-output.txt
          cp results/results.json results/java17-gc.json
          docker run --rm -v "$(pwd)/results:/results" bench:java25 \
            -f 3 -wi 5 -i 5 -prof gc \
            -p size=1000000 -p taskCount=10000 \
            "BoxingOverhead|ObjectAllocation|StreamPerformance|VirtualThreads" \
            2>&1 | tee results/java25-gc-output.txt
          cp results/results.json results/java25-gc.json

      - name: "📈 Compare & print plain text table"
        run: |
          echo "## 🚀 Java 17 vs Java 25 — Performance Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/compare-results.py \
            results/java17.json "Java 17" \
            results/java25.json "Java 25" > results/comparison-17vs25.txt 2>&1
          cat results/comparison-17vs25.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧠 Memory Comparison (GC allocation rate)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/compare-results.py \
            results/java17-gc.json "Java 17" \
            results/java25-gc.json "Java 25" > results/comparison-17vs25-memory.txt 2>&1
          cat results/comparison-17vs25-memory.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Key:** Lower ms/op = faster. Java 25 benefits from improved JIT, compact headers, and virtual threads." >> $GITHUB_STEP_SUMMARY

      - name: "🖼️ Generate all charts"
        run: |
          pip install matplotlib numpy -q
          mkdir -p results/charts
          python3 scripts/generate-charts.py \
            results/java17.json "Java 17" \
            results/java25.json "Java 25" \
            results/charts java17-vs-java25
          python3 scripts/generate-charts.py --memory \
            results/java17-gc.json "Java 17" \
            results/java25-gc.json "Java 25" \
            results/charts java17-vs-java25-memory
        continue-on-error: true

      - name: "📦 Upload results + charts (single zip)"
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-17-vs-25
          path: |
            Performance Improvement/results/charts/
            Performance Improvement/results/comparison-*.txt

  benchmark-25-vs-28:
    name: "📊 Java 25 vs Java 28 EA (Valhalla)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Performance Improvement"

    steps:
      - uses: actions/checkout@v4

      - name: "🏗️ Build images"
        run: |
          docker build -f Dockerfile.java25 -t bench:java25 .
          docker build -f Dockerfile.java28 -t bench:java28 .

      - name: "📊 Run Java 25 Valhalla benchmarks"
        run: |
          mkdir -p results
          docker run --rm -v "$(pwd)/results:/results" bench:java25 \
            -f 3 -wi 5 -i 5 -p size=1000000 ".*Valhalla.*" \
            2>&1 | tee results/java25-valhalla-output.txt
          cp results/results.json results/java25-valhalla.json

      - name: "📊 Run Java 28 EA Valhalla benchmarks"
        run: |
          docker run --rm -v "$(pwd)/results:/results" bench:java28 \
            -f 3 -wi 5 -i 5 -p size=1000000 ".*Valhalla.*" \
            2>&1 | tee results/java28-valhalla-output.txt
          cp results/results.json results/java28-valhalla.json

      - name: "🧠 Run Valhalla memory benchmarks (GC profiler)"
        run: |
          docker run --rm -v "$(pwd)/results:/results" bench:java25 \
            -f 3 -wi 5 -i 5 -prof gc -p size=1000000 ".*Valhalla.*" \
            2>&1 | tee results/java25-valhalla-gc-output.txt
          cp results/results.json results/java25-valhalla-gc.json
          docker run --rm -v "$(pwd)/results:/results" bench:java28 \
            -f 3 -wi 5 -i 5 -prof gc -p size=1000000 ".*Valhalla.*" \
            2>&1 | tee results/java28-valhalla-gc-output.txt
          cp results/results.json results/java28-valhalla-gc.json

      - name: "📈 Compare & print plain text table"
        run: |
          echo "## 🔮 Java 25 vs Java 28 EA — Valhalla Value Types" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Project Valhalla introduces **value classes** that eliminate object headers" >> $GITHUB_STEP_SUMMARY
          echo "and enable flat array layouts — dramatically reducing memory and improving cache locality." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/compare-results.py \
            results/java25-valhalla.json "Java 25" \
            results/java28-valhalla.json "Java 28 EA" > results/comparison-25vs28.txt 2>&1
          cat results/comparison-25vs28.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧠 Memory Comparison" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/compare-results.py \
            results/java25-valhalla-gc.json "Java 25" \
            results/java28-valhalla-gc.json "Java 28 EA" > results/comparison-25vs28-memory.txt 2>&1
          cat results/comparison-25vs28-memory.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What Valhalla changes" >> $GITHUB_STEP_SUMMARY
          echo "| Aspect | Java 25 (records) | Java 28 EA (value classes) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------------|---------------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Point object size | ~24 bytes (header + data) | ~8 bytes (flattened) |" >> $GITHUB_STEP_SUMMARY
          echo "| Array layout | Pointers to heap objects | Contiguous flat data |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache behavior | Pointer-chasing (misses) | Sequential access (fast) |" >> $GITHUB_STEP_SUMMARY
          echo "| GC pressure | Millions of small objects | Zero allocations |" >> $GITHUB_STEP_SUMMARY

      - name: "🖼️ Generate all charts"
        run: |
          pip install matplotlib numpy -q
          mkdir -p results/charts
          python3 scripts/generate-charts.py \
            results/java25-valhalla.json "Java 25" \
            results/java28-valhalla.json "Java 28 EA" \
            results/charts java25-vs-java28-valhalla
          python3 scripts/generate-charts.py --memory \
            results/java25-valhalla-gc.json "Java 25" \
            results/java28-valhalla-gc.json "Java 28 EA" \
            results/charts java25-vs-java28-valhalla-memory
        continue-on-error: true

      - name: "📦 Upload results + charts (single zip)"
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-25-vs-28-valhalla
          path: |
            Performance Improvement/results/charts/
            Performance Improvement/results/comparison-*.txt
