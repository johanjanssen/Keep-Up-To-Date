name: JaCoCo Demo

on:
  push:
    branches: [main]
    paths: ['Jacoco/**']
  workflow_dispatch:

jobs:
  jacoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run JaCoCo port-based demo
        run: bash "Jacoco/scripts/Retrieve Coverage From Port/run-demo.sh"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: Jacoco/target/coverage-report/

