name: JaCoCo Demo

on:
  push:
    branches: [master]
    paths: ['JaCoCo/**']
  workflow_dispatch:

jobs:
  jacoco:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run JaCoCo port-based demo
        run: bash "JaCoCo/scripts/Retrieve Coverage From Port/run-demo.sh"

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/coverage-report
          mv JaCoCo/target/coverage-report/* tmp/coverage-report/

      # Published as its own subfolder (destination_dir + keep_files) rather than
      # actions/deploy-pages, because this repo has MULTIPLE workflows publishing
      # to the same Pages site (static.yml → root, compare-scans.yml → Scans/,
      # benchmark-java-versions.yml → Benchmarks/). actions/deploy-pages replaces
      # the ENTIRE site on every run, so those workflows were silently wiping each
      # other's content out. Publishing to a gh-pages branch with destination_dir
      # scopes each workflow to its own subfolder and keep_files stops it from
      # touching the others.
      - name: Publish to GitHub Pages (JaCoCo/ subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tmp/coverage-report
          destination_dir: JaCoCo
          keep_files: true

# Now the coverage report is available under https://johanjanssen.github.io/Keep-Up-To-Date/JaCoCo/index.html
#
# First-time setup: this needs the repo's Pages source set to "Deploy from a
# branch → gh-pages" under Settings → Pages (rather than "GitHub Actions") —
# see benchmark-java-versions.yml / compare-scans.yml / static.yml, which all
# publish to the same branch/subfolder scheme.
