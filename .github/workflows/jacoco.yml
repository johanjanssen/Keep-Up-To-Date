name: JaCoCo Demo

on:
  push:
    branches: [master]
    paths: ['JaCoCo/**']
  workflow_dispatch:

# Several workflows (static.yml, owasp-dc.yml, compare-scans.yml, this one) each
# publish their own subfolder to the same gh-pages branch. They share this group
# so their deploys queue up one after another instead of racing to push the branch.
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  jacoco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run JaCoCo port-based demo
        run: bash "JaCoCo/scripts/Retrieve Coverage From Port/run-demo.sh"

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/coverage-report/JaCoCo
          mv JaCoCo/target/coverage-report/* tmp/coverage-report/JaCoCo/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Now the coverage report is available under https://johanjanssen.github.io/Keep-Up-To-Date/JaCoCo[/index.html]
