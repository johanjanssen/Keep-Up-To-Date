name: JaCoCo Demo

on:
  push:
    branches: [main]
    paths: ['JaCoCo/**']
  workflow_dispatch:

jobs:
  jacoco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run JaCoCo port-based demo
        run: bash "JaCoCo/scripts/Retrieve Coverage From Port/run-demo.sh"

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/coverage-report/Jacoco
          mv JaCoCo/target/coverage-report tmp/coverage-report/Jacoco

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/coverage-report

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
