name: JaCoCo Demo

on:
  push:
    branches: [master]
    paths: ['JaCoCo/**']
  workflow_dispatch:

# Several workflows (static.yml, owasp-dc.yml, compare-scans.yml, this one) each
# publish their own subfolder to the same gh-pages branch. They share this group
# so their deploys queue up one after another instead of racing to push the branch.
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  jacoco:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run JaCoCo port-based demo
        run: bash "JaCoCo/scripts/Retrieve Coverage From Port/run-demo.sh"

      # Published as its own subfolder (destination_dir + keep_files) rather than
      # actions/deploy-pages: this repo has multiple workflows publishing to the
      # same Pages site, and actions/deploy-pages replaces the ENTIRE site on every
      # run (it also requires an environment: github-pages block on the job, which
      # is where "Missing environment" comes from) — peaceiris pushes to the
      # gh-pages branch and destination_dir scopes each workflow to its own folder.
      - name: Deploy to GitHub Pages (JaCoCo/ subfolder)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: JaCoCo/target/coverage-report
          destination_dir: JaCoCo
          keep_files: true

# Now the coverage report is available under https://johanjanssen.github.io/Keep-Up-To-Date/JaCoCo[/index.html]
