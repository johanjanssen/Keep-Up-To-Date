name: Renovate Config Validate

on:
  push:
    branches: [master]
    paths: ['Renovate/renovate.json', 'renovate.json']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate renovate.json
        run: |
          docker run --rm \
            -v "$(pwd)/Renovate/renovate.json:/usr/src/app/renovate.json" \
            renovate/renovate:latest \
            renovate-config-validator renovate.json

