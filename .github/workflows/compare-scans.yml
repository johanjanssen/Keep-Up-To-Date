name: Compare Security Scans

on:
  push:
    branches: [master]
    paths: ['Compare Security Scans/**']
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Note: Docker multi-stage builds compile the app internally.
      # No separate Maven build needed here.

      - name: Pull & tag base images
        run: bash "Build Docker Images/pull-base-images.sh"

      - name: Build all hello-conference Docker images
        run: bash "Build Docker Images/build-all-images.sh"
        # A single flaky image (e.g. a transient network blip in a native-image
        # toolchain download) shouldn't stop the other images from being scanned
        # and reported on — scan-*.sh / compare.sh already handle unbuilt images
        # gracefully (they show up as "NOT BUILT" instead of failing the run).
        continue-on-error: true

      - name: Scan with Grype
        run: bash "Compare Security Scans/scripts/scan-grype.sh"

      - name: Scan with Trivy
        run: bash "Compare Security Scans/scripts/scan-trivy.sh"

      - name: Compare results (plain text)
        run: |
          bash "Compare Security Scans/scripts/compare.sh" 2>&1 | tee /tmp/compare-output.txt
          echo "## 📊 Security Scan Comparison — Trivy vs Grype" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compare-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate presentation charts
        run: |
          pip install matplotlib numpy -q
          python3 "Compare Security Scans/scripts/generate-charts.py" \
            "Compare Security Scans/target/results/trivy" \
            "Compare Security Scans/target/results/grype" \
            "Compare Security Scans/target/results/charts" \
            --title "Container Image CVE Comparison — Trivy vs Grype" \
            --prefix scan
        continue-on-error: true

      - name: Generate HTML report
        run: |
          python3 "Compare Security Scans/scripts/generate-html-report.py" \
            "Compare Security Scans/target/results/trivy" \
            "Compare Security Scans/target/results/grype" \
            "Compare Security Scans/target/results/charts" \
            /tmp/compare-output.txt \
            "Compare Security Scans/target/results/html/index.html" \
            --title "Container Image CVE Comparison — Trivy vs Grype"

      - name: Prepare Pages directory
        run: |
          mkdir -p tmp/pages/Scans
          cp "Compare Security Scans/target/results/html/index.html" tmp/pages/Scans/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tmp/pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Now the report is available under https://johanjanssen.github.io/Keep-Up-To-Date/Scans[/index.html]

      - name: Upload comparison data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-comparison-data
          path: Compare Security Scans/target/results/

      - name: Upload chart — comparison table
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-scan-table
          path: Compare Security Scans/target/results/charts/scan-table.png

      - name: Upload chart — comparison barplot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-scan-barplot
          path: Compare Security Scans/target/results/charts/scan-barplot.png
