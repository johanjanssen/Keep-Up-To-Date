name: Compare Security Scans

on:
  push:
    branches: [master]
    paths: ['Compare Security Scans/**', 'images.conf']
  workflow_dispatch:

# Several workflows (static.yml, jacoco.yml, owasp-dc.yml, this one) each
# publish their own subfolder to the same gh-pages branch. Each workflow gets its
# OWN concurrency group (rather than sharing one) so this run — including the
# Docker builds and scans above — is never cancelled while queued behind an
# unrelated workflow's deploy: GitHub cancels *queued* runs within a shared
# group even with cancel-in-progress: false. The deploy step below still pushes
# to the shared gh-pages branch, so it's wrapped in Wandalen/wretry.action to
# retry automatically on the rare occasion it collides with another workflow's
# push.
concurrency:
  group: "gh-pages-deploy-compare-scans"
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Note: Docker multi-stage builds compile the app internally.
      # No separate Maven build needed here.

      - name: Pull & tag base images
        run: bash "Build Docker Images/pull-base-images.sh"

      - name: Build all hello-conference Docker images
        run: bash "Build Docker Images/build-all-images.sh"
        # A single flaky image (e.g. a transient network blip in a native-image
        # toolchain download) shouldn't stop the other images from being scanned
        # and reported on — scan-*.sh / compare.sh already handle unbuilt images
        # gracefully (they show up as "NOT BUILT" instead of failing the run).
        continue-on-error: true

      - name: Scan with Grype
        run: bash "Compare Security Scans/scripts/scan-grype.sh"

      - name: Scan with Trivy
        run: bash "Compare Security Scans/scripts/scan-trivy.sh"

      - name: Compare results (plain text)
        run: |
          bash "Compare Security Scans/scripts/compare.sh" 2>&1 | tee /tmp/compare-output.txt
          echo "## 📊 Security Scan Comparison — Trivy vs Grype" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/compare-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate HTML reports
        run: |
          pip install matplotlib numpy -q
          python3 "Compare Security Scans/scripts/generate-html-report.py" \
            "Compare Security Scans/target/results/trivy" \
            "Compare Security Scans/target/results/grype" \
            "Compare Security Scans/target/results/html/index.html" \
            "Compare Security Scans/target/results/html-custom/index.html" \
            --title "Container Image CVE Comparison — Trivy vs Grype" \
            --custom-title "hello-conference Image CVE Comparison — Trivy vs Grype"

      - name: Prepare Pages directories
        run: |
          mkdir -p tmp/pages tmp/pages-custom
          cp "Compare Security Scans/target/results/html/index.html" tmp/pages/
          cp "Compare Security Scans/target/results/html-custom/index.html" tmp/pages-custom/

      # Published as their own subfolders (destination_dir + keep_files) rather
      # than actions/deploy-pages: this repo has multiple workflows publishing to
      # the same Pages site, and actions/deploy-pages replaces the ENTIRE site on
      # every run (it also requires an environment: github-pages block on the job,
      # which is where "Missing environment" comes from) — peaceiris pushes to the
      # gh-pages branch and destination_dir scopes each workflow to its own
      # folder. Base images and hello-conference images are split into separate
      # pages, so each gets its own deploy step.
      - name: Deploy to GitHub Pages (image-scans/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages
            destination_dir: image-scans
            keep_files: true

      # Now the base-images report is available under https://johanjanssen.github.io/Keep-Up-To-Date/image-scans/index.html

      - name: Deploy to GitHub Pages (custom-image-scans/ subfolder)
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/pages-custom
            destination_dir: custom-image-scans
            keep_files: true

      # Now the hello-conference report is available under https://johanjanssen.github.io/Keep-Up-To-Date/custom-image-scans/index.html

      - name: Upload comparison data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-comparison-data
          path: Compare Security Scans/target/results/
