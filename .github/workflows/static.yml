# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow pushing to the gh-pages branch
permissions:
  contents: write

# Several workflows (jacoco.yml, owasp-dc.yml, compare-scans.yml, this one) each
# publish their own subfolder to the same gh-pages branch. They share this group
# so their deploys queue up one after another instead of racing to push the branch.
concurrency:
  group: "gh-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root landing page
        run: |
          mkdir -p tmp/root
          cat > tmp/root/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Keep Up To Date</title>
          </head>
          <body>
            <h1>Keep Up To Date</h1>
            <ul>
              <li><a href="Presentation/">Presentation</a></li>
              <li><a href="JaCoCo/">JaCoCo coverage demo</a></li>
              <li><a href="OWASP/">OWASP Dependency Check report</a></li>
              <li><a href="Scans/">Trivy vs Grype scan comparison</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Deploy root landing page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tmp/root
          destination_dir: .
          keep_files: true

      - name: Deploy Presentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Presentation
          destination_dir: Presentation
          keep_files: true

      # Now the presentation is available under https://johanjanssen.github.io/Keep-Up-To-Date/Presentation[/]
