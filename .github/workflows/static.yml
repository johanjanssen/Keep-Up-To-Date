# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Published to the ROOT of the gh-pages branch with keep_files: true, rather
      # than actions/deploy-pages, because this repo has MULTIPLE workflows
      # publishing to the same Pages site (jacoco.yml → JaCoCo/, compare-scans.yml
      # → Scans/, benchmark-java-versions.yml → Benchmarks/). actions/deploy-pages
      # replaces the ENTIRE site on every run, so those workflows were silently
      # wiping each other's content out. keep_files preserves those subfolders
      # while this workflow only touches its own (root-level) files.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: 'Presentation'
          keep_files: true
