# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow pushing to the gh-pages branch
permissions:
  contents: write

# Several workflows (jacoco.yml, owasp-dc.yml, compare-scans.yml, this one) each
# publish their own subfolder to the same gh-pages branch. Each workflow gets its
# OWN concurrency group (rather than sharing one) so this run is never cancelled
# while queued behind an unrelated workflow's deploy — GitHub cancels *queued*
# runs within a shared group even with cancel-in-progress: false. The deploy
# steps below still push to the shared gh-pages branch, so they're wrapped in
# Wandalen/wretry.action to retry automatically on the rare occasion they
# collide with another workflow's push.
concurrency:
  group: "gh-pages-deploy-static"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build root landing page
        run: |
          mkdir -p tmp/root
          cat > tmp/root/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Keep Up To Date</title>
          </head>
          <body>
            <h1>Keep Up To Date</h1>
            <ul>
              <li><a href="Presentation/">Presentation</a></li>
              <li><a href="JaCoCo/">JaCoCo coverage demo</a></li>
              <li><a href="OWASP/">OWASP Dependency Check report</a></li>
              <li><a href="Scans/">Trivy vs Grype scan comparison</a></li>
              <li><a href="images/">Docker image size &amp; performance comparison</a></li>
              <li><a href="testcontainers/">Testcontainers integration test results</a></li>
              <li><a href="Benchmarks/">Java 17 vs 25 vs 28 EA performance benchmarks</a></li>
            </ul>
          </body>
          </html>
          HTML

      - name: Deploy root landing page
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: tmp/root
            destination_dir: .
            keep_files: true

      - name: Deploy Presentation to GitHub Pages
        uses: Wandalen/wretry.action@v3
        with:
          action: peaceiris/actions-gh-pages@v4
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: Presentation
            destination_dir: Presentation
            keep_files: true

      # Now the presentation is available under https://johanjanssen.github.io/Keep-Up-To-Date/Presentation[/]
