<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeping Your Code, Dependencies, and Runtime Up to Date</title>
    <!--
      SHARP CHARTS — The trick:
      Reveal.js scales slides with CSS transform:scale(S). Chart.js only knows
      about devicePixelRatio (DPR) and renders a canvas at CSS-px × DPR.
      But the browser physically renders those pixels scaled by S, so the
      effective backing-store resolution is CSS-px × DPR × S.
      Fix: before creating any Chart, set the canvas backing store to that
      full resolution, scale the 2D context accordingly, then tell Chart.js
      devicePixelRatio=1 so it makes no further adjustments.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/solarized.css" id="theme">
    <!-- Monokai's own bundled theme colored annotations/meta tokens (e.g. Java's
         @Test, @Container) a dull olive-grey (#75715e) on its near-black
         background — 3:1 contrast, hard to read from the back of a room —
         while keywords and strings sat at the opposite extreme in
         high-saturation pink/green. Atom One Dark's palette is calmer and
         every token category clears WCAG AA (4.5:1) against its background
         except comments, which are bumped in the override below. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.css">
    <style>
        /* Atom One Dark's own comment color (#5c6370) is ~2.3:1 on its
           background — fine for de-emphasized comments in an editor, too
           low when this deck's demo code leans on step-numbered comments
           (e.g. "# 1: Build the JAR") as part of the narration. Lightened
           to clear 4.5:1 while staying visibly muted. */
        .hljs-comment { color: #9099a6; }
        /* Windows ships no flag emoji, so Chrome/Edge there render e.g. 🇦🇺 as
           the letters "AU". This bundled Twemoji flags font (fonts/LICENSE.md)
           only covers the regional-indicator range, so all other emoji keep
           using the native emoji font. */
        @font-face {
            font-family:'Twemoji Country Flags';
            unicode-range:U+1F1E6-1F1FF, U+1F3F4, U+E0062-E0063, U+E0065, U+E0067, U+E006C, U+E006E, U+E0073-E0074, U+E0077, U+E007F;
            src:url('fonts/TwemojiCountryFlags.woff2') format('woff2');
            font-display:swap;
        }
        :root { --r-heading-font:'Twemoji Country Flags','Inter','Segoe UI',sans-serif; --r-main-font:'Twemoji Country Flags','Inter','Segoe UI',sans-serif; }
        /* Slide-in transitions animate `transform` on each <section> (and the
           `.slides` wrapper carries `perspective`), which puts the entering
           slide into its own GPU compositing layer for the duration of the
           animation. WebKit/Blink render text in that state with plain
           grayscale antialiasing instead of native subpixel antialiasing,
           then switch back once the layer is torn down — that switch is the
           "blurry, then sharpens" flash on every slide change/load. Pinning
           font smoothing to one mode up front stops the mid-transition
           antialiasing swap, so no visible re-sharpening happens after the
           transition settles. */
        .reveal { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        .reveal h1,.reveal h2,.reveal h3 { text-transform:none; color:#6c71c4; }
        /* Theme sets .reveal h2{font-size:24pt!important}; override needs !important too */
        .reveal h2 { font-size:15pt!important; }
        /* Chapter/agenda divider slides — a lone <h1> used to render as raw
           giant theme text (3.77em) with nothing else on the slide, which is
           why it looked "fullscreen". Give it a proper title-card treatment
           instead: a small numbered kicker, a normal-sized heading, an accent
           rule, and a large translucent number as a background flourish. */
        .reveal .chapter-slide { position:relative; }
        .reveal .chapter-slide .chapter-num {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-52%);
            font-size:10em; font-weight:800; line-height:1; font-family:var(--r-heading-font);
            color:rgba(108,113,196,0.10); z-index:0; pointer-events:none; user-select:none;
        }
        .reveal .chapter-slide .chapter-kicker {
            position:relative; z-index:1; display:block;
            font-size:0.5em; font-weight:700; letter-spacing:0.32em;
            text-transform:uppercase; color:#268bd2; margin-bottom:0.8em;
        }
        .reveal .chapter-slide h1 {
            position:relative; z-index:1; font-size:2.3em; max-width:85%; margin:0 auto;
        }
        .reveal .chapter-slide .chapter-rule {
            position:relative; z-index:1;
            width:3.5em; height:4px; margin:0.9em auto 0;
            background:linear-gradient(90deg,#268bd2,#6c71c4); border-radius:99px;
        }
        .reveal .chapter-slide h2 { position:relative; z-index:1; margin-top:0.7em!important; }
        .reveal table { font-size:0.58em; margin:0 auto; }
        .reveal table th { background:rgba(38,139,210,0.15); }
        .reveal table td,.reveal table th { padding:0.3em 0.65em; border:1px solid rgba(88,110,117,0.25); }
        .reveal .small  { font-size:0.55em; }
        .reveal .medium { font-size:0.68em; }
        .badge-row { display:flex; flex-wrap:wrap; gap:0.5em; justify-content:center; margin:0.5em 0; }
        .badge-row img { height:22px; }
        .reveal pre { width:95%; font-size:0.42em; }
        /* Code examples sized for a projector; lines are wrapped to fit, so no scrolling */
        .reveal pre.code-lg { font-size:0.8em; }
        .reveal pre.code-lg code { max-height:none; }
        /* Fixed pixel height on chart containers so offsetHeight is stable */
        .chart-wrap { width:88%; max-width:740px; margin:0 auto; }
        /* Two charts shown side by side (size-vs-CVE + size-vs-packages).
           Spans nearly the full slide instead of the single-chart 740px cap
           so long image names stay legible even split across two charts —
           each .chart-wrap inside fills its half rather than centering at
           its own max-width. */
        .chart-row { display:flex; gap:1.2em; width:97%; max-width:1500px; margin:0 auto; align-items:flex-start; }
        .chart-row .chart-wrap { flex:1 1 0; width:auto; max-width:none; }
        /* Live report embeds: reveal.js scales the whole slide with CSS transform,
           and iframes forward real mouse/scroll/click events through that transform
           just fine — so these are genuinely click-through-able during a talk, not
           just a static screenshot. A fixed px height (not %) keeps it stable across
           slide transitions; width:100% fills the available slide width. */
        .iframe-wrap { width:100%; margin:0.6em auto 0; }
        .iframe-wrap iframe {
            width:100%; height:440px; border:1px solid rgba(38,139,210,0.35);
            border-radius:8px; background:#fff;
        }
        /* .wide breaks the wrap past the slide's own edge to use the letterboxed
           space reveal.js leaves on wider screens, for reports with long lines
           or many columns that need every pixel they can get. reveal.js sets
           --viewport-width and --slide-scale on .reveal-viewport, so their
           quotient is the screen width in (unscaled) slide px; minus a small
           gutter that's how wide the wrap gets, centred via negative margins.
           Never narrower than the slide (100%), capped at 1900px for very wide
           screens; without those variables it falls back to the slide width. */
        .iframe-wrap.wide {
            --wide-w: clamp(100%, calc(var(--viewport-width, 0px) / var(--slide-scale, 1) - 40px), 1900px);
            width:var(--wide-w);
            margin-left:calc((100% - var(--wide-w)) / 2);
            margin-right:calc((100% - var(--wide-w)) / 2);
        }
        /* .tall gives the iframe nearly the full slide height (700px minus the
           heading) for a single-table report like /custom-images/#size, so
           every row fits without scrolling at a projector-readable size. */
        .iframe-wrap.tall iframe { height:580px; }
        /* Nested "layers of dependencies" diagram, drawn in plain HTML/CSS so
           it renders instantly (it used to be a PlantUML diagram fetched from
           the public render server, which made the slide pop in late). */
        .layers { margin:0.6em auto 0; max-width:820px; font-size:0.62em; text-align:center; }
        .layer { border:2px solid #586e75; border-radius:12px; padding:0.5em 0.9em 0.9em; color:#073642; }
        .layer .layer { margin-top:0.5em; }
        .layer-title { display:block; font-weight:700; }
        .layer-example { display:block; font-size:0.92em; font-style:italic; color:#586e75; }
        .layer-vm   { background:#ECE8F7; }
        .layer-os   { background:#FDEBD9; }
        .layer-app  { background:#DCEEFB; }
        .layer-deps { background:#E6F4D9; padding-bottom:1.6em; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:1em; text-align:left; }
        /* Three-across variant for slides with exactly three tool/item boxes —
           .two-col wraps a 3rd child onto its own half-width row, which looks
           unbalanced; this keeps all three the same width in one row. */
        .three-col { display:grid; grid-template-columns:repeat(3,1fr); gap:1em; text-align:left; }
        /* Agenda overview slide — number-bubble cards grouped into two
           color-coded tracks instead of a plain two-column numbered list. */
        .agenda-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.8em; text-align:left; margin-top:0.3em; }
        .agenda-kicker { display:block; font-size:0.62em; font-weight:800; letter-spacing:0.2em; text-transform:uppercase; margin-bottom:0.5em; }
        .agenda-list { list-style:none; margin:0; padding:0; }
        .agenda-list li { display:flex; align-items:center; gap:0.55em; padding:0.28em 0.55em; border-radius:7px; margin-bottom:0.2em; font-size:0.64em; }
        .agenda-list li:nth-child(odd) { background:rgba(38,139,210,0.06); }
        .agenda-num { flex:0 0 auto; width:1.55em; height:1.55em; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7em; font-weight:800; color:#fdf6e3; }
        .agenda-num-a { background:linear-gradient(135deg,#268bd2,#6c71c4); }
        .agenda-num-b { background:linear-gradient(135deg,#cb4b16,#d33682); }
        .agenda-emoji { flex:0 0 auto; font-size:1em; }
        /* Sub-dividers inside the "Concrete examples" run — a lighter echo
           of .chapter-slide's kicker+rule treatment, marking where each of
           the three demos starts without competing with the full chapter
           breaks. */
        .reveal .example-slide { position:relative; }
        .reveal .example-slide .example-kicker {
            display:block; font-size:0.5em; font-weight:700; letter-spacing:0.28em;
            text-transform:uppercase; color:#268bd2; margin-bottom:0.7em;
        }
        .reveal .example-slide h1 { font-size:1.9em; max-width:85%; margin:0 auto; }
        .reveal .example-slide .example-rule {
            width:3em; height:4px; margin:0.8em auto 0;
            background:linear-gradient(90deg,#cb4b16,#d33682); border-radius:99px;
        }
        .box { background:rgba(38,139,210,0.08); border:1px solid rgba(38,139,210,0.25); border-radius:8px; padding:0.7em; margin:0.4em 0; }
        .box-red   { background:rgba(220,50,47,0.1);   border-color:rgba(220,50,47,0.4); }
        .box-green { background:rgba(133,153,0,0.1);  border-color:rgba(133,153,0,0.4); }
        .box-blue  { background:rgba(38,139,210,0.1); border-color:rgba(38,139,210,0.4); }
        .reveal .subtitle { color:#268bd2; font-size:0.68em; }
        .reveal section img { border:none; box-shadow:none; }
        /* Full-bleed photos (r-stretch .jpg only — logos/diagrams as .svg are left
           untouched so their edges aren't clipped): soft corners + a gentle fade
           toward the edges so they blend into the slide instead of sitting as a
           hard rectangle. */
        .reveal section img.r-stretch[src$=".jpg"] {
            border-radius:16px;
            -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, #000 78%, transparent 100%);
                    mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, #000 78%, transparent 100%);
        }
        .go-btn { display:inline-block; background:#859900; color:#fdf6e3 !important; padding:0.25em 0.7em; border-radius:6px; text-decoration:none !important; font-weight:bold; font-size:0.55em; margin:0.2em; }
        .go-btn:hover { background:#6b7a00; }
        .tag-good { color:#859900; font-weight:bold; }
        .tag-bad  { color:#dc322f; font-weight:bold; }
        .tag-warn { color:#cb4b16; font-weight:bold; }
        .timeline { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:0; margin:0.8em 0; }
        .tl-item  { background:rgba(108,113,196,0.15); border:1px solid rgba(108,113,196,0.4); border-radius:6px; padding:0.4em 0.7em; font-size:0.52em; text-align:center; }
        .tl-lts   { background:rgba(133,153,0,0.15); border-color:rgba(133,153,0,0.5); }
        .tl-now   { background:rgba(211,54,130,0.15); border-color:rgba(211,54,130,0.6); }
        .tl-arrow { color:#6c71c4; font-size:0.9em; margin:0 0.25em; }
        .java-pill { display:inline-block; background:rgba(203,75,22,0.2); border:1px solid rgba(203,75,22,0.5); border-radius:4px; padding:0.1em 0.5em; font-size:0.6em; vertical-align:middle; margin-left:0.4em; color:#cb4b16; }
        /* Automation flywheel — six step cards placed around an elliptical
           gradient ring (SVG) with a hub in the middle, instead of an
           indented code block. Fixed px stage: reveal.js scales the whole
           slide, so absolute positions stay put. Cards pop in one by one
           when the slide becomes .present; the ring's dashes keep flowing
           clockwise to sell the "it keeps turning" idea. */
        .flywheel { position:relative; width:880px; height:470px; margin:0.3em auto 0; }
        .flywheel svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
        .flywheel .fw-flow { stroke-dasharray:4 14; animation:fw-spin 1.6s linear infinite; }
        @keyframes fw-spin { to { stroke-dashoffset:-18; } }
        .fw-hub {
            position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            width:250px; padding:18px 14px; border-radius:50%/42%; text-align:center;
            background:radial-gradient(circle at 30% 25%, #fffdf6, #f3ecd8);
            border:2px solid rgba(108,113,196,0.35);
            box-shadow:0 10px 30px rgba(108,113,196,0.18);
        }
        .fw-hub .fw-hub-ic { display:block; font-size:34px; line-height:1.1; }
        .fw-hub strong { display:block; font-size:21px; color:#6c71c4; margin-top:4px; }
        .fw-hub span.fw-hub-sub { display:block; font-size:14px; color:#657b83; margin-top:4px; }
        .fw-node {
            --c:#268bd2;
            position:absolute; width:214px; transform:translate(-50%,-50%);
            display:flex; align-items:center; gap:10px; text-align:left;
            padding:9px 12px; border-radius:12px; background:#fffdf6;
            border:1px solid color-mix(in srgb, var(--c) 35%, transparent);
            border-left:5px solid var(--c);
            box-shadow:0 6px 18px color-mix(in srgb, var(--c) 18%, transparent);
        }
        .fw-node .fw-num {
            flex:0 0 auto; width:30px; height:30px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            background:var(--c); color:#fdf6e3; font-size:15px; font-weight:800;
        }
        .fw-node .fw-txt { font-size:15px; line-height:1.25; color:#586e75; }
        .fw-node .fw-txt strong { display:block; font-size:17px; color:#073642; }
        .reveal .present .fw-node { animation:fw-pop 0.45s cubic-bezier(.2,.9,.3,1.3) both; }
        .reveal .present .fw-node:nth-of-type(2) { animation-delay:0.15s; }
        .reveal .present .fw-node:nth-of-type(3) { animation-delay:0.3s; }
        .reveal .present .fw-node:nth-of-type(4) { animation-delay:0.45s; }
        .reveal .present .fw-node:nth-of-type(5) { animation-delay:0.6s; }
        .reveal .present .fw-node:nth-of-type(6) { animation-delay:0.75s; }
        .reveal .present .fw-node:nth-of-type(7) { animation-delay:0.9s; }
        @keyframes fw-pop { from { opacity:0; transform:translate(-50%,-50%) scale(0.7); } }
        @media (prefers-reduced-motion: reduce) {
            .flywheel .fw-flow, .reveal .present .fw-node { animation:none; }
        }
        code { font-size:0.9em !important; }
        /* Icon-list — dresses up a plain bullet list: a leading icon chip,
           alternating row tint and rounded corners, instead of a bare <ul>.
           Use for prose-y bullet slides that aren't already inside a .box. */
        .icon-list { list-style:none; margin:0.3em 0 0; padding:0; text-align:left; }
        .icon-list li { display:flex; align-items:flex-start; gap:0.6em; padding:0.4em 0.7em; border-radius:8px; margin-bottom:0.28em; }
        .icon-list li:nth-child(odd) { background:rgba(38,139,210,0.07); }
        .icon-list .ic { flex:0 0 auto; font-size:1.15em; line-height:1.3; }
        .icon-list .sub-list { list-style:disc; margin:0.2em 0 0 1.2em; padding:0; }
        .icon-list .sub-list li { display:list-item; padding:0.1em 0; margin:0; background:none; border-radius:0; }
        /* Stat row — a horizontal strip of big-number tiles, for the handful
           of headline figures a slide wants to land instead of burying them
           in a bullet list. */
        .stat-row { display:flex; flex-wrap:wrap; gap:0.8em; justify-content:center; margin:0.7em 0; }
        .stat-tile { flex:1 1 150px; max-width:210px; background:rgba(220,50,47,0.08); border:1px solid rgba(220,50,47,0.32); border-radius:10px; padding:0.7em 0.6em; text-align:center; }
        .stat-tile .num { display:block; font-size:1.7em; font-weight:800; color:#dc322f; line-height:1.15; }
        .stat-tile .lbl { display:block; font-size:0.58em; color:#657b83; margin-top:0.35em; line-height:1.3; }
        .stat-row.good .stat-tile { background:rgba(133,153,0,0.08); border-color:rgba(133,153,0,0.35); }
        .stat-row.good .stat-tile .num { color:#859900; }
        /* Card grid — icon + title (+ optional line) tiles for slides that
           list a handful of parallel points, instead of a plain bullet list.
           --cols sets the column count, --c a card's accent color. */
        .card-grid { display:grid; grid-template-columns:repeat(var(--cols,4),1fr); gap:0.7em; margin:0.8em auto 0; }
        .card { --c:#268bd2; background:color-mix(in srgb, var(--c) 8%, transparent); border:1px solid color-mix(in srgb, var(--c) 30%, transparent); border-top:5px solid var(--c); border-radius:10px; padding:0.8em 0.6em; text-align:center; }
        .card .card-ic { display:block; font-size:1.6em; line-height:1.2; }
        .card strong { display:block; margin-top:0.3em; color:#073642; line-height:1.25; }
        .card .card-txt { display:block; font-size:0.78em; color:#657b83; margin-top:0.35em; line-height:1.3; }
        .card-banner { margin:0.8em auto 0; padding:0.55em 1em; border-radius:10px; background:rgba(220,50,47,0.08); border:1px solid rgba(220,50,47,0.32); font-weight:700; color:#073642; }
        .card-banner .num { color:#dc322f; }
        /* Browser-chrome mockup for the repo slide: github.com sends
           X-Frame-Options: deny / frame-ancestors 'none', so it can't be
           embedded live like the GitHub Pages report iframes below — this
           wraps its social-preview image (opengraph.githubassets.com, which
           has no such restriction on <img>) in a fake address bar instead,
           and the whole thing is a real link out to the repo. */
        .browser-mock { max-width:760px; margin:0.6em auto 0; border-radius:10px; overflow:hidden; border:1px solid rgba(38,139,210,0.35); background:#fdf6e3; text-decoration:none; display:block; }
        .browser-mock-bar { display:flex; align-items:center; gap:0.5em; padding:0.5em 0.8em; background:#eee8d5; border-bottom:1px solid rgba(38,139,210,0.25); }
        .browser-mock-dots { display:flex; gap:0.3em; }
        .browser-mock-dots span { width:9px; height:9px; border-radius:50%; display:inline-block; }
        .browser-mock-dots span:nth-child(1) { background:#dc322f; }
        .browser-mock-dots span:nth-child(2) { background:#cb4b16; }
        .browser-mock-dots span:nth-child(3) { background:#859900; }
        .browser-mock-url { flex:1; background:#fdf6e3; border:1px solid rgba(88,110,117,0.3); border-radius:5px; padding:0.3em 0.7em; font-size:0.5em; color:#268bd2; text-align:left; font-family:monospace; }
        .browser-mock img { width:100%; display:block; }
    </style>
</head>
<body>
<div class="reveal">
<!-- Sections from external files are injected here -->
<div class="slides" id="slides-container"></div>
</div><!-- /reveal -->

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<script>
// ─── Colour palette ───────────────────────────────────────────────────────────
const C = {
    cyan:   'rgba(38,139,210,0.85)',
    green:  'rgba(133,153,0,0.85)',
    purple: 'rgba(108,113,196,0.85)',
    pink:   'rgba(211,54,130,0.85)',
    orange: 'rgba(203,75,22,0.85)',
    red:    'rgba(220,50,47,0.85)',
    yellow: 'rgba(181,137,0,0.85)',
    fg:     '#586e75',
    grid:   'rgba(101,123,131,0.18)',
};

// ─── Sharp canvas helper ──────────────────────────────────────────────────────
//
// WHY this is needed:
//   Reveal.js applies CSS transform:scale(S) to fit slides in the viewport.
//   For example on a 1920px screen with a 960px slide width, S = 2.
//   Chart.js renders canvas at CSS-pixels × window.devicePixelRatio.
//   But the browser physically scales those pixels by S as well.
//   So the canvas needs to be CSS-px × DPR × S to appear sharp.
//
// The fix:
//   1. Read the canvas element's actual CSS pixel size (post-layout).
//   2. Expand the backing store to CSS-px × (DPR × revealScale).
//   3. Pre-scale the 2D context by that factor.
//   4. Tell Chart.js devicePixelRatio=1 and responsive=false so it never
//      resizes or rescales the context again.
//
function makeChart(id, cfg) {
    const canvas = document.getElementById(id);
    if (!canvas || canvas._chart) return;

    const dpr         = window.devicePixelRatio || 1;
    const revealScale = Reveal.getScale()        || 1;
    const totalScale  = dpr * revealScale;

    // An unstyled <canvas> reports its default 300px width attribute as
    // offsetWidth, so a chart inside a wider .chart-wrap would be drawn
    // at 300px and leave the rest of its half of the slide empty. Size
    // from the wrapper instead; the height attribute stays the source of
    // truth for height.
    const w = canvas.parentElement.offsetWidth  || canvas.offsetWidth  || 700;
    const h = canvas.offsetHeight || canvas.parentElement.offsetHeight || 300;

    canvas.width  = Math.round(w * totalScale);
    canvas.height = Math.round(h * totalScale);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';

    const ctx = canvas.getContext('2d');
    ctx.scale(totalScale, totalScale);

    cfg.options                  = cfg.options || {};
    cfg.options.devicePixelRatio = 1;       // context already scaled — don't touch it
    cfg.options.responsive       = false;   // don't resize inside a transformed slide
    cfg.options.animation        = cfg.options.animation ?? { duration: 500 };

    canvas._chart = new Chart(ctx, cfg);
}

function axis(extra) {
    return {
        ticks: { color: C.fg, font: { size: 12 }, ...(extra || {}) },
        grid:  { color: C.grid }
    };
}

// ─── Live "Image Size vs CVE Count" / "Image Size vs Package Count" charts ──
//
// Two groups — generic OS base images and Java JRE/JDK/GraalVM base images —
// mirroring images.conf's own BASE_IMAGES_GENERIC / BASE_IMAGES_JAVA split
// (the single source of truth every report in this repo already reads from).
//
// Data comes from two GitHub Actions workflows that publish JSON to the same
// gh-pages chart-data/ folder (see .github/workflows/measure-images.yml and
// compare-scans.yml):
//   image-sizes.json  — Build Docker Images/scripts/generate-html-report.py
//                        (name, size_mb AND packages — all three measured
//                        directly during that workflow's build/measure step,
//                        never hardcoded here)
//   cve-counts.json   — Compare Security Scans/scripts/generate-html-report.py
// Both are already grouped generic/java AND already ordered the same way
// as images.conf's arrays (the Python that produces them reads that order
// directly) — so merging is a simple by-name lookup, not a re-sort.
//
// Each group renders as a PAIR of charts shown side by side (see .chart-row
// in the <style> above): size vs CVE count, and size vs package count.
//
// This fetch is kicked off immediately (not gated on slide visibility) so
// the data is normally ready well before a live talk reaches this slide.
// renderGroupCharts() is re-run on every slide change and whenever the fetch
// settles, and only builds a chart once its canvas is both visible
// (offsetWidth > 0 — same sharp-canvas requirement as makeChart) and not
// already built, so a slow network never produces a blurry 0-width chart —
// it just renders next time the slide is (re-)shown. If the data can't be
// loaded (or a group is empty), the canvas is hidden and replaced with a
// short message rather than ever showing fabricated numbers.
const CHART_DATA_BASE_URL = 'https://johanjanssen.github.io/Keep-Up-To-Date/chart-data/';
let liveChartData = null;   // { generic:[...], java:[...] } once loaded
let liveChartFailed = false;

const GROUP_CHART_SPECS = [
    { key: 'generic',
      cveChartId: 'chartBaseImages', cveTitle: 'Base OS images: size (MB) vs CVE count (Grype), live data',
      pkgChartId: 'chartBasePackages', pkgTitle: 'Base OS images: size (MB) vs package count, live data',
      nameFontSize: 18 },
    { key: 'java',
      cveChartId: 'chartJavaImages', cveTitle: 'Java runtime images (JDK/JRE/GraalVM): size (MB) vs CVE count (Grype), live data',
      pkgChartId: 'chartJavaPackages', pkgTitle: 'Java runtime images (JDK/JRE/GraalVM): size (MB) vs package count, live data',
      nameFontSize: 18 },
];

// sizeRows already carry "packages" straight from image-sizes.json — no
// second fetch needed for the packages chart, only the CVE chart needs the
// by-name merge against cve-counts.json.
function mergeSizeAndCveGroup(sizeRows, cveRows) {
    const cveByName = new Map((cveRows || []).map(r => [r.name, r.cves]));
    return (sizeRows || []).map(r => ({
        name: r.name,
        size_mb: r.size_mb,
        packages: r.packages ?? null,
        cves: cveByName.has(r.name) ? cveByName.get(r.name) : null
    }));
}

// Bars are colored by that image's own CVE count (not by size): green for
// none, then yellow → orange → red as the count grows.
function sizeBarColor(cves) {
    if (cves === null || cves === undefined) return C.purple; // unknown — no matching scan yet
    if (cves === 0)   return C.green;
    if (cves < 30)    return C.yellow;
    if (cves < 80)    return C.orange;
    return C.red;
}

// Same idea, scaled to package counts (roughly: fewer installed OS packages
// == smaller attack surface) rather than CVEs.
function packageBarColor(packages) {
    if (packages === null || packages === undefined) return C.purple; // unknown — couldn't be counted
    if (packages === 0)   return C.green;
    if (packages < 20)    return C.yellow;
    if (packages < 100)   return C.orange;
    return C.red;
}

// x-axis tick options shared by both chart types below: the image-name
// labels are long (e.g. "registry.access.redhat.com/ubi9/openjdk-25-runtime"),
// so ticks are rotated at a fixed angle and never auto-skipped — every
// image gets a label instead of Chart.js thinning them out to fit.
// The base OS and Java runtime groups pass a bigger font size.
// Registry hosts ("registry.access.redhat.com/", "gcr.io/", …) add a lot of
// label length without telling the audience much, so they're dropped from
// the x-axis labels; "gcr.io/distroless/static-debian13" becomes
// "distroless/static-debian13".
function shortImageName(name) {
    const slash = name.indexOf('/');
    return slash > 0 && name.slice(0, slash).includes('.') ? name.slice(slash + 1) : name;
}

function nameAxis(fontSize = 12) {
    return axis({ font: { size: fontSize }, autoSkip: false, maxRotation: 55, minRotation: 55 });
}

function buildGroupChartConfig(rows, titleText, nameFontSize) {
    return {
        type: 'bar',
        data: {
            labels: rows.map(r => shortImageName(r.name)),
            datasets: [
                {
                    label: 'Image Size (MB)',
                    data: rows.map(r => r.size_mb),
                    backgroundColor: rows.map(r => sizeBarColor(r.cves)),
                    borderRadius: 4,
                    yAxisID: 'ySize'
                },
                {
                    type: 'line',
                    label: 'CVEs (Grype)',
                    data: rows.map(r => r.cves),
                    borderColor: C.pink,
                    backgroundColor: C.pink,
                    pointRadius: 5,
                    borderWidth: 2,
                    tension: 0.2,
                    spanGaps: true,
                    yAxisID: 'yCves'
                }
            ]
        },
        options: {
            // Rotated x-axis labels hang down-left from their tick, so the
            // first few long image names would otherwise be clipped at the
            // canvas's left edge.
            layout: { padding: { left: 40 } },
            plugins: {
                legend: { display: true, labels: { color: C.fg, font: { size: 17 } } },
                title:  { display: true, text: titleText, color: C.fg, font: { size: 17 } }
            },
            scales: {
                x:     { ...nameAxis(nameFontSize), grid: { display: false } },
                ySize: { ...axis({ font: { size: 16 } }), position: 'left',  title: { display: true, text: 'MB',  color: C.fg, font: { size: 16 } } },
                yCves: { ...axis({ font: { size: 16 } }), position: 'right', title: { display: true, text: 'CVEs', color: C.fg, font: { size: 16 } }, grid: { display: false } }
            }
        }
    };
}

function buildPackagesChartConfig(rows, titleText, nameFontSize) {
    return {
        type: 'bar',
        data: {
            labels: rows.map(r => shortImageName(r.name)),
            datasets: [
                {
                    label: 'Image Size (MB)',
                    data: rows.map(r => r.size_mb),
                    backgroundColor: rows.map(r => packageBarColor(r.packages)),
                    borderRadius: 4,
                    yAxisID: 'ySize'
                },
                {
                    type: 'line',
                    label: 'OS packages',
                    data: rows.map(r => r.packages),
                    borderColor: C.purple,
                    backgroundColor: C.purple,
                    pointRadius: 5,
                    borderWidth: 2,
                    tension: 0.2,
                    spanGaps: true,
                    yAxisID: 'yPkgs'
                }
            ]
        },
        options: {
            // Rotated x-axis labels hang down-left from their tick, so the
            // first few long image names would otherwise be clipped at the
            // canvas's left edge.
            layout: { padding: { left: 40 } },
            plugins: {
                legend: { display: true, labels: { color: C.fg, font: { size: 17 } } },
                title:  { display: true, text: titleText, color: C.fg, font: { size: 17 } }
            },
            scales: {
                x:     { ...nameAxis(nameFontSize), grid: { display: false } },
                ySize: { ...axis({ font: { size: 16 } }), position: 'left',  title: { display: true, text: 'MB',       color: C.fg, font: { size: 16 } } },
                yPkgs: { ...axis({ font: { size: 16 } }), position: 'right', title: { display: true, text: 'Packages', color: C.fg, font: { size: 16 } }, grid: { display: false } }
            }
        }
    };
}

function showChartFallback(canvas) {
    if (canvas.dataset.fallbackShown) return;
    canvas.dataset.fallbackShown = '1';
    canvas.style.display = 'none';
    const msg = document.createElement('p');
    msg.className = 'small';
    msg.style.color = '#dc322f';
    msg.textContent = '⚠ Live chart data isn’t available right now; see the latest "Measure Docker Images" / "Compare Security Scans" workflow runs for current numbers.';
    canvas.insertAdjacentElement('afterend', msg);
}

// Renders one canvas from one (spec, cfgBuilder) pair — shared by both the
// CVE chart and the packages chart in each group, since they only differ in
// which canvas id / config builder they use.
function renderOneGroupChart(canvasId, rows, cfgBuilder) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || canvas._chart || !canvas.offsetWidth) return; // not on this slide, not visible, or already built
    if (!rows || !rows.length) {
        showChartFallback(canvas);
        return;
    }
    makeChart(canvasId, cfgBuilder(rows));
}

function renderGroupCharts() {
    if (!liveChartData && !liveChartFailed) return; // fetch still in flight
    GROUP_CHART_SPECS.forEach(spec => {
        const rows = liveChartData && liveChartData[spec.key];
        renderOneGroupChart(spec.cveChartId, rows, r => buildGroupChartConfig(r, spec.cveTitle, spec.nameFontSize));
        renderOneGroupChart(spec.pkgChartId, rows, r => buildPackagesChartConfig(r, spec.pkgTitle, spec.nameFontSize));
    });
}

async function loadLiveChartData() {
    try {
        const [sizesRes, cvesRes] = await Promise.all([
            fetch(CHART_DATA_BASE_URL + 'image-sizes.json', { cache: 'no-store' }),
            fetch(CHART_DATA_BASE_URL + 'cve-counts.json',  { cache: 'no-store' })
        ]);
        if (!sizesRes.ok || !cvesRes.ok) throw new Error(`HTTP ${sizesRes.status}/${cvesRes.status}`);
        const [sizes, cves] = await Promise.all([sizesRes.json(), cvesRes.json()]);
        liveChartData = {
            generic: mergeSizeAndCveGroup(sizes.generic, cves.generic),
            java:    mergeSizeAndCveGroup(sizes.java,    cves.java)
        };
    } catch (e) {
        console.error('Live chart data unavailable:', e);
        liveChartFailed = true;
    }
    renderGroupCharts();
}
loadLiveChartData();

Reveal.on('ready',        renderGroupCharts);
Reveal.on('slidechanged', renderGroupCharts);

// ─── Load external slide section files, then initialize Reveal exactly once ───
//
// Every <section> that used to live inline in this file now lives in
// sections/*.html: sections/intro.html for the title/agenda material that
// opens the talk, one file per Agenda topic (sections/agenda-NN-*.html).
//
// This list controls both WHICH files are shown and the ORDER they play in —
// reorder it freely to change slide flow, no other code needs to change.
// The chart/PlantUML listeners above are registered before Reveal.initialize()
// runs so they don't miss the 'ready' event once loading finishes.
const slideFiles = [
    'sections/intro.html',                          // title, follow-along, agenda
    'sections/agenda-01-the-problem.html',
    'sections/agenda-02-ai.html',
    'sections/agenda-03-update-or-remove.html',
    'sections/agenda-04-minimize-os-dependencies.html',
    'sections/agenda-05-minimize-code-dependencies.html',
    'sections/agenda-06-minimize-source-code.html',
    'sections/agenda-07-native-images.html',
    'sections/agenda-08-update-os-dependencies.html',
    'sections/agenda-09-update-code-dependencies.html',
    'sections/agenda-10-update-source-code.html',
    'sections/agenda-11-testing.html',
    'sections/agenda-12-scan-for-vulnerabilities.html',
    'sections/agenda-13-takeaways-and-conclusion.html'
];

const container = document.getElementById('slides-container');

Promise.all(
    slideFiles.map(file =>
        fetch(file)
            .then(response => {
                if (!response.ok) throw new Error(`Failed to load ${file}`);
                return response.text();
            })
    )
)
    .then(htmlContents => {
        container.innerHTML = htmlContents.join('\n');

        // Initialize Reveal.js ONLY after the DOM is fully populated —
        // it needs every <section> present up front to compute slide count,
        // history/hash state, etc.
        Reveal.initialize({
            hash: true,
            slideNumber: false,
            transition: 'slide',
            plugins: [RevealHighlight, RevealNotes],
            navigationMode: 'linear',
            controls: false,
            progress: true,
            history: true,
            center: true
        });
    })
    .catch(error => {
        console.error('Error loading external slides:', error);
        container.innerHTML = `<section><h2>Error loading slides</h2><p>${error.message}</p></section>`;
    });
</script>
</body>
</html>
