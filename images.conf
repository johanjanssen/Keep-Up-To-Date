#!/usr/bin/env bash
# images.conf — Shared image list sourced by all scanning scripts.
# Usage: source "$(dirname "$0")/../images.conf"  (from any scripts/ directory)
#
# BASE_IMAGES is split into two explicit groups — generic OS images vs Java
# runtime images (JDK/JRE/GraalVM) — because that split is meaningful to a
# reader (comparing alpine:3 against eclipse-temurin:25-jdk tells you
# nothing useful) and because this is now the single source of truth for it:
# generate-html-report.py in both Build Docker Images/scripts/ and
# Compare Security Scans/scripts/ reads these two arrays directly (by
# sourcing this file via bash) to decide which of their three report tables
# each image belongs to, instead of guessing from the image name. Add a new
# Java base image to BASE_IMAGES_JAVA (not BASE_IMAGES_GENERIC) and every
# report picks it up automatically — no separate list to keep in sync.
#
# Everything that doesn't care about the distinction (pulling, building,
# scanning) can keep using BASE_IMAGES / ALL_IMAGES exactly as before —
# those are just the two groups concatenated below.

BASE_IMAGES_GENERIC=(
    "ubuntu:26.04"
    "debian:13"
    "debian:13-slim"
    "gcr.io/distroless/base-debian13"
    "gcr.io/distroless/static-debian13"
    "almalinux:10"
    "almalinux/10-base"
    "almalinux:10-minimal"
    "almalinux/10-micro"
    "registry.access.redhat.com/ubi9-micro:latest"
    # "scratch" itself is a reserved pseudo-image (no registry manifest, can't
    # be pulled) — scratch-probe:local is a locally-built stand-in (just
    # "FROM scratch", see Build Docker Images/Dockerfile.scratch-probe) so it
    # can be measured/scanned like every other base image instead of assumed.
    "alpine:3"
    "busybox:latest"
    "scratch-probe:local"
)

BASE_IMAGES_JAVA=(
    "eclipse-temurin:25-jdk"
    "eclipse-temurin:25-jdk-alpine"
    "eclipse-temurin:25-jre"
    "eclipse-temurin:25-jre-alpine"
    "azul/zulu-openjdk:25-jre"
    "azul/zulu-openjdk:25-jre-headless"
    "azul/zulu-openjdk:25-jre-crac"
    "azul/zulu-openjdk-alpine:25-jre"
    "azul/zulu-openjdk-alpine:25-jre-headless"
    "gcr.io/distroless/java25-debian13"
    "ghcr.io/graalvm/native-image-community:25i2"
    "amazoncorretto:25"
    "amazoncorretto:25-alpine"
    # Ubuntu-based only for now — IBM hasn't published an Alpine/musl
    # tag for Semeru (OpenJ9) 25 yet (checked against Docker Hub's tag list).
    "ibm-semeru-runtimes:open-25-jre"
    "registry.access.redhat.com/ubi9/openjdk-25-runtime:latest"
    "cgr.dev/chainguard/jdk:latest"
    "cgr.dev/chainguard/jre:latest"
    "bellsoft/liberica-runtime-container:jre-25-slim-musl"
    "bellsoft/liberica-runtime-container:jre-25-slim-glibc"
)

BASE_IMAGES=("${BASE_IMAGES_GENERIC[@]}" "${BASE_IMAGES_JAVA[@]}")

APP_IMAGES=(
    "hello-conference:jre-temurin"
    "hello-conference:jre-temurin-alpine"
    "hello-conference:jlink-full-distroless-base-debian"
    "hello-conference:jlink-distroless-base-debian"
    "hello-conference:jlink-netty-distroless-base-debian"
    "hello-conference:jlink-cds-distroless-base-debian"
    "hello-conference:crac-azul-distroless-base-debian"
    "hello-conference:native-debian-slim"
    "hello-conference:native-minimal-distroless-static-debian"
    "hello-conference:native-scratch"
    "hello-conference:native-netty-scratch"
)

ALL_IMAGES=("${BASE_IMAGES[@]}" "${APP_IMAGES[@]}")

# Convert image name to safe filename: eclipse-temurin:25-jre → eclipse-temurin_25-jre
image_to_filename() {
    echo "$1" | tr '/:' '__'
}
